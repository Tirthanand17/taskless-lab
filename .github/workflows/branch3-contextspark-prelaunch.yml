name: Branch 3 ContextSpark Channel-Ready QA (NO YOUTUBE)

on:
  pull_request:
    paths:
      - "branch3/**"
      - ".github/workflows/branch3-contextspark-prelaunch.yml"
      - "scripts/branch3_validate_prelaunch.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit_prelaunch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      PUBLISH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate original SVG and release-off defaults; no credentials
        run: |
          python -B -m py_compile scripts/branch3_validate_prelaunch.py
          python -B scripts/branch3_validate_prelaunch.py
