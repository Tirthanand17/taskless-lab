name: FlowMinute Cloud Render Smoke (no secrets)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "autopilot/**"
      - "motion-v2/src/**"
      - ".github/workflows/flowminute-cloud-render-smoke.yml"
permissions:
  contents: read
concurrency:
  group: flowminute-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  short_render_and_quality_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned wheel-supplied FFmpeg and existing Remotion dependencies
        timeout-minutes: 7
        run: |
          set -euo pipefail
          # The apt mirror stalled for 150 seconds in actual CI #42204252917.
          # Python wheel includes its OWN GNU/Linux ffmpeg binary; no apt,
          # sudo, local user device or privileged package index refresh.
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-deps 'imageio-ffmpeg==0.6.0'
          python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg
          executable=Path(imageio_ffmpeg.get_ffmpeg_exe())
          if not executable.is_file() or not executable.stat().st_size>100_000:
              raise RuntimeError("Pinned FFmpeg wheel did not include usable binary")
          dest=Path(os.environ["RUNNER_TEMP"])/"flowminute-ffmpeg-bin"
          dest.mkdir(mode=0o700,exist_ok=True)
          (dest/"ffmpeg").symlink_to(executable)
          with open(os.environ["GITHUB_PATH"],"a",encoding="utf8") as f:
              f.write(str(dest)+"\n")
          print("B4D3_PINNED_FFMPEG_BINARY_PRESENT_NO_APT")
          PY
          export PATH="$RUNNER_TEMP/flowminute-ffmpeg-bin:$PATH"
          ffmpeg -hide_banner -version | head -n 1
          cd motion-v2
          npm install --no-audit --no-fund --fetch-retries=1 --fetch-timeout=45000
      - name: Cloud Remotion screenshot smoke (original template)
        working-directory: motion-v2
        run: |
          mkdir -p /tmp/flowminute-cloud-preview
          npx remotion still src/index.ts DotsNightThumbnail /tmp/flowminute-cloud-preview/thumbnail.png --frame=0 --log=error
          test -s /tmp/flowminute-cloud-preview/thumbnail.png
          file /tmp/flowminute-cloud-preview/thumbnail.png
      - name: Cloud render 2 seconds of a previously published Short
        working-directory: motion-v2
        run: |
          npx remotion render src/index.ts DotsWorkShort /tmp/flowminute-cloud-preview/short-smoke.mp4 \
            --frames=0-59 --concurrency=1 --codec=h264 --crf=28 --pixel-format=yuv420p --log=error
          test -s /tmp/flowminute-cloud-preview/short-smoke.mp4
      - name: Verify decoded audio, dimensions and duration
        run: |
          set -euo pipefail
          f=/tmp/flowminute-cloud-preview/short-smoke.mp4
          ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
          # The pinned FFmpeg binary also prints independent demuxed stream
          # metadata; test actual codec, dimensions and audio stream after full decode.
          python - "$f" <<'PY'
          import re,subprocess,sys
          media=sys.argv[1]
          check=subprocess.run(
              ["ffmpeg","-hide_banner","-i",media],
              capture_output=True,text=True,timeout=30)
          info=check.stderr
          tracks=info.splitlines()
          video=[line for line in tracks if re.search(r"Stream #\d+:\d+",line)
                 and "Video: h264" in line]
          audio=[line for line in tracks if re.search(r"Stream #\d+:\d+",line)
                 and "Audio: aac" in line]
          if len(video)!=1 or not any(
              re.search(r"(?<!\d)1080x1920(?!\d)",line) for line in video):
              raise RuntimeError("Decoded smoke video is not 1080x1920 H.264")
          if len(audio)!=1:
              raise RuntimeError("Decoded smoke audio is not AAC")
          print("B4D3_1080x1920_H264_AAC_METADATA_VERIFIED_WITH_PINNED_FFMPEG")
          PY
          sha256sum "$f"
          echo "CLOUD_1080x1920_SHORT_SMOKE_QA_PASSED"
      - name: Discard video output; never store public/unreviewed drafts
        if: always()
        run: rm -rf /tmp/flowminute-cloud-preview
