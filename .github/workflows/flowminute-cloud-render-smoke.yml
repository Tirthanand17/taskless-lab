name: FlowMinute Cloud Render Smoke (no secrets)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "autopilot/**"
      - "motion-v2/src/**"
      - ".github/workflows/flowminute-cloud-render-smoke.yml"
permissions:
  contents: read
concurrency:
  group: flowminute-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  short_render_and_quality_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free open-source media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          sudo apt-get install -y -qq fonts-noto-core
          test -f /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
          python -m pip install 'pillow>=11,<13'
          cd motion-v2
          npm install --no-audit --no-fund
      - name: Cloud Remotion screenshot smoke (original template)
        working-directory: motion-v2
        run: |
          mkdir -p /tmp/flowminute-cloud-preview
          npx remotion still src/index.ts DotsNightThumbnail /tmp/flowminute-cloud-preview/thumbnail.png --frame=0 --log=error
          test -s /tmp/flowminute-cloud-preview/thumbnail.png
          file /tmp/flowminute-cloud-preview/thumbnail.png
      - name: Cloud render 2 seconds of a previously published Short
        working-directory: motion-v2
        run: |
          npx remotion render src/index.ts DotsWorkShort /tmp/flowminute-cloud-preview/short-smoke.mp4 \
            --frames=0-59 --concurrency=1 --codec=h264 --crf=28 --pixel-format=yuv420p --log=error
          test -s /tmp/flowminute-cloud-preview/short-smoke.mp4
      - name: Verify decoded audio, dimensions and duration
        run: |
          set -euo pipefail
          f=/tmp/flowminute-cloud-preview/short-smoke.mp4
          ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")" = "1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f")" = "aac"
          sha256sum "$f"
          echo "CLOUD_1080x1920_SHORT_SMOKE_QA_PASSED"
      - name: Generate REAL original CSV visual preview (no narrator, no upload)
        run: |
          set -euo pipefail
          python -m autopilot.phase3_csv_visual_preview \
            --output /tmp/flowminute-cloud-preview/csv-visual-only.mp4 \
            --duration 3 --fps 12 --width 360
          ffmpeg -v error -xerror -i /tmp/flowminute-cloud-preview/csv-visual-only.mp4 -f null -
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/flowminute-cloud-preview/csv-visual-only.mp4)" = "360"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 /tmp/flowminute-cloud-preview/csv-visual-only.mp4 | wc -l)" = "0"
          echo "ORIGINAL_CSV_VISUAL_MP4_DECODED__NOT_READY_TO_PUBLISH"
      - name: Render actual Hindi Short and 16x9 long visual-only QA
        run: |
          set -euo pipefail
          python -m autopilot.phase3_hindi_visual_preview \
            --episode csv_tutorial_short_hi \
            --output /tmp/flowminute-cloud-preview/csv-hindi-short-visual.mp4 \
            --duration 0.5 --fps 8 --width 360
          python -m autopilot.phase3_hindi_visual_preview \
            --episode csv_tutorial_long_hi \
            --output /tmp/flowminute-cloud-preview/csv-hindi-long-visual.mp4 \
            --duration 0.5 --fps 8 --width 640
          for f in /tmp/flowminute-cloud-preview/csv-hindi-{short,long}-visual.mp4; do
            ffmpeg -nostdin -v error -xerror -i "$f" -f null -
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$f" | wc -l)" = "0"
          done
          echo "HINDI_GLYPHS_PORTRAIT_LANDSCAPE_VIDEO_ONLY_PREVIEWS_PASS"
      - name: Render both FULL 42s CSV Shorts VISUAL ONLY within free-runner cap
        run: |
          set -euo pipefail
          root=/tmp/flowminute-cloud-preview
          # Original 8fps/360w moving visual proof, NOT final publication quality.
          timeout 240s python -m autopilot.phase3_csv_visual_preview \
            --output "$root/csv-english-FULL-VISUAL-ONLY.mp4" \
            --duration 42 --fps 8 --width 360
          timeout 240s python -m autopilot.phase3_hindi_visual_preview \
            --episode csv_tutorial_short_hi \
            --output "$root/csv-hindi-FULL-VISUAL-ONLY.mp4" \
            --duration 42 --fps 8 --width 360
          python - <<'PY'
          from pathlib import Path
          import json, subprocess
          root=Path("/tmp/flowminute-cloud-preview")
          for language in ("english","hindi"):
              media=root/f"csv-{language}-FULL-VISUAL-ONLY.mp4"
              probe=subprocess.run(
                  ["ffprobe","-v","error","-show_entries",
                   "stream=codec_type,codec_name,width,height,nb_frames:format=duration",
                   "-of","json",str(media)],
                  capture_output=True,text=True,check=True,timeout=20,
              )
              data=json.loads(probe.stdout)
              video=data["streams"]
              assert len(video)==1 and video[0]["codec_type"]=="video"
              assert video[0]["codec_name"]=="h264"
              assert (video[0]["width"],video[0]["height"])==(360,640)
              assert abs(float(data["format"]["duration"])-42)<0.15
              assert int(video[0]["nb_frames"])==336
              subprocess.run(
                  ["ffmpeg","-nostdin","-v","error","-xerror",
                   "-i",str(media),"-f","null","-"],
                  check=True,timeout=90,
              )
              print(f"FULL_42_SECOND_{language.upper()}_VIDEO_ONLY_QA_PASSED")
          PY
      - name: Assemble FULL 7m12s Hindi silent 16x9 video from 24 bounded scenes
        run: |
          set -euo pipefail
          # Entire 432s silent H264 proof at 640x360 / 8fps, not a
          # publishable video. Do not upload or persist any unreviewed media.
          timeout 480s python -m autopilot.phase3_long_visual_assembly \
            --output /tmp/flowminute-cloud-preview/csv-hindi-long-FULL-VISUAL-ONLY.mp4 \
            --fps 8 --width 640
          echo "FULL_432_SECOND_HINDI_VISUAL_ONLY_QA_PASSED"
      - name: Audio mux proof using SYNTHETIC tone only (NEVER release)
        run: |
          set -euo pipefail
          ffmpeg -nostdin -v error -f lavfi -i "sine=frequency=220:sample_rate=16000" \
            -t 3 -ac 1 -c:a pcm_s16le \
            /tmp/flowminute-cloud-preview/THIS_IS_NOT_SPEECH.wav
          python - <<'PY'
          from pathlib import Path
          from autopilot.phase3_quarantined_audio_mux import mux_visual_with_external_wav
          base=Path("/tmp/flowminute-cloud-preview")
          result=mux_visual_with_external_wav(
            episode_id="csv_tutorial_short_en",
            video_path=base/"csv-visual-only.mp4",
            wav_path=base/"THIS_IS_NOT_SPEECH.wav",
            output_path=base/"SYNTHETIC_TONE_QA_ONLY.mp4",
          )
          assert result["audio_codec"] == "aac"
          assert not result["actual_natural_speech_verified"]
          assert not result["audio_caption_alignment_verified"]
          assert not result["voice_rights_verified"]
          assert not result["publishing_authorized"]
          print("REAL_AAC_MUX_WITH_FAKE_TONE_ONLY__PUBLICATION_BLOCKED")
          PY
      - name: Discard video output; never store public/unreviewed drafts
        if: always()
        run: rm -rf /tmp/flowminute-cloud-preview
