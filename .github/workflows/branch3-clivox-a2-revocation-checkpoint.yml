name: Branch 3 Clivox A2 Signed Revocation Checkpoints (OFFLINE / NO RIGHTS)

on:
  pull_request:
    paths:
      - 'scripts/branch3_a2_checkpointed_revocations.py'
      - 'scripts/test_branch3_a2_checkpointed_revocations.py'
      - 'scripts/branch3_a2_review_receipt.py'
      - 'scripts/test_branch3_a2_review_receipt.py'
      - 'branch3/rights_review/**'
      - 'branch3/architecture/progress-tracker.json'
      - '.github/workflows/branch3-clivox-a2-revocation-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a2-checkpoint-math-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_signed_checkpoint_offline_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_REAL_REVIEWER_KEY_ENROLLED: 'false'
      CLIVOX_REAL_CHECKPOINT_AUTHORITY_ENROLLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only Ed25519 verifier
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<47'
      - name: Verify hash chain, checkpoint signature, anchor and anti-rollback guards
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a2_checkpointed_revocations.py scripts/test_branch3_a2_checkpointed_revocations.py
          python -B -m unittest -v scripts.test_branch3_a2_checkpointed_revocations scripts.test_branch3_a2_review_receipt scripts.test_branch3_rights_case_intake
      - name: CLI fixture cannot claim real clearance or public video access
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a2_checkpointed_revocations --mode fixture > "$RUNNER_TEMP/clivox-a2-checkpoint.json"
          python -B -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a2-checkpoint.json"; d=json.loads(p.read_text()); assert d["actual_external_api_calls"]==0 and d["real_checkpoint_keys_enrolled"] is False and d["real_external_durable_floor_verified"] is False and d["authentic_creator_license_verified"] is False and d["source_media_download_authorized"] is False and d["youtube_upload_authorized"] is False and d["youtube_schedule_authorized"] is False and d["youtube_publish_authorized"] is False; print("CLIVOX_A2_CHECKPOINT_NO_AUTHORITY_NO_WRITES")'
      - name: Deny writes and prevent secrets or licensed footage in CI
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_REAL_REVIEWER_KEY_ENROLLED" = 'false'
          test "$CLIVOX_REAL_CHECKPOINT_AUTHORITY_ENROLLED" = 'false'
      # No artifacts: no private contract, actor identity, or media objects.
