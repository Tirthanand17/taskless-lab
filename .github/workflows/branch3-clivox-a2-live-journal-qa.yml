name: Branch 3 Clivox A2 Live Journal Bridge QA (OFFLINE NO SECRETS)

on:
  pull_request:
    paths:
      - 'scripts/branch3_a2_live_journal_readonly.py'
      - 'scripts/test_branch3_a2_live_journal_readonly.py'
      - 'scripts/branch3_a2_private_ledger_cas.py'
      - 'branch3/rights_review/**'
      - '.github/workflows/branch3-clivox-a2-live-journal-readonly.yml'
      - '.github/workflows/branch3-clivox-a2-live-journal-qa.yml'
      - 'branch3/architecture/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove_manual_journal_bridge_without_external_access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_MEDIA_STORAGE_WRITE_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated cryptographic test dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<47'
      - name: Adversarial mocked GitHub owner, journal, key and anchor checks
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a2_live_journal_readonly.py scripts/test_branch3_a2_live_journal_readonly.py
          python -B -m unittest -v scripts.test_branch3_a2_live_journal_readonly scripts.test_branch3_a2_private_ledger_cas scripts.test_branch3_a2_checkpointed_revocations scripts.test_branch3_a3_private_vault_readback
      - name: Fixture must never claim live credentials or rights
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a2_live_journal_readonly --mode fixture > "$RUNNER_TEMP/clivox-a2-private-readonly-fixture.txt"
          python -B -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a2-private-readonly-fixture.txt").read_text()); assert d["actual_github_get_count"]==0 and d["actual_github_write_count"]==0 and d["live_private_journal_verified"] is False and d["independent_anchor_durability_verified"] is False and d["genuine_creator_licenses_verified"]==0 and d["source_media_download_authorized"] is False and d["youtube_upload_authorized"] is False and d["youtube_publish_authorized"] is False; print("CLIVOX_A2_JOURNAL_NO_AUTHORITY_NO_REAL_READBACK")'
      - name: Confirm CI has no media or publication privileges
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_STORAGE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
      # No artifacts, private repository secrets or copyrighted recordings.
