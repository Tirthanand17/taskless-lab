name: Render Brand Assets

on:
  push:
    paths:
      - "scripts/render_brand_assets.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/render_brand_assets.py
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/brand
          git diff --cached --quiet && exit 0
          git commit -m "Render FlowMinute Lab channel assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
