name: FLOWMINUTE Stage Exact Owner-Reviewed Videos (NO PUBLISH)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/flowminute-stage-20261102-media.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: flowminute-20261102-staging
  cancel-in-progress: false

jobs:
  stage_exact_review_masters:
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLISH_ENABLED: 'false'
      FLOWMINUTE_ENABLE_PUBLISH: '0'
      FLOWMINUTE_DAILY_SPEND_CAP_USD: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install offline verification dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v gh
          mkdir -p incoming/en incoming/hi incoming/long staged/en staged/hi staged/long
      - name: Download exact original CI render artifacts
        run: |
          set -euo pipefail
          gh run download 41426295160 --repo "$GITHUB_REPOSITORY" --name flowminute-flow-explain-full-av-review-only --dir incoming/en
          gh run download 41426295175 --repo "$GITHUB_REPOSITORY" --name flowminute-flow-explain-hindi-full-av-review-only --dir incoming/hi
          gh run download 41431772149 --repo "$GITHUB_REPOSITORY" --name flowminute-hi-agent-permission-long-full-review-only --dir incoming/long
          echo '196a46f1ff4685bc9b47e3050157e5da77160803acb3464ec4b9ec642b49248b  incoming/en/FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_EN_REVIEW_ONLY.mp4' | sha256sum --check --status
          echo '879db5d26d163c40b1b053edca3cf0974509cc4ba2bbd23a5586a9d4fa34bc2b  incoming/hi/FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_HI_REVIEW_ONLY.mp4' | sha256sum --check --status
          echo '518b44a137bbdddec32ee84e7f64cbe0c55e49ae52fab277f75d1bb3158fbb2c  incoming/long/FLOWMINUTE_AI_AGENT_HINDI_LONG_REVIEW_ONLY.mp4' | sha256sum --check --status
      - name: Create approved masters using the pinned original Debian 13 FFmpeg 7.1.5 build
        run: |
          set -euo pipefail
          # Original owner-reviewed master was produced with Debian 13 FFmpeg 7.1.5.
          # Ubuntu FFmpeg's AAC encoder output is NOT bitwise identical; never relax SHA checks.
          docker run --rm -v "$PWD:/work" -w /work debian:trixie-slim bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ffmpeg
            ffmpeg -hide_banner -version | head -1 | grep -F "ffmpeg version 7.1.5-0+deb13u1"
            for lang in en hi long; do
              case "$lang" in
                en) video="FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_EN_REVIEW_ONLY.mp4"; name="FLOWMINUTE_ENGLISH_V6_AUDIO_MASTER_REVIEW_ONLY.mp4"; captions="flow-explain-english-phrase-captions.srt";;
                hi) video="FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_HI_REVIEW_ONLY.mp4"; name="FLOWMINUTE_HINDI_V2_AUDIO_MASTER_REVIEW_ONLY.mp4"; captions="flow-explain-hindi-phrase-captions.srt";;
                long) video="FLOWMINUTE_AI_AGENT_HINDI_LONG_REVIEW_ONLY.mp4"; name="FLOWMINUTE_HI_LONG_AUDIO_MASTER_REVIEW_ONLY.mp4"; captions="hindi-long-captions.srt";;
              esac
              ffmpeg -hide_banner -nostdin -loglevel error -xerror \
                -i "incoming/$lang/$video" -map 0:v:0 -map 0:a:0 \
                -c:v copy -c:a aac -b:a 192k \
                -af "loudnorm=I=-18:TP=-1.5:LRA=9" \
                -movflags +faststart "staged/$lang/$name"
              cp "incoming/$lang/$captions" "staged/$lang/$captions"
              ffmpeg -hide_banner -nostdin -loglevel error -xerror \
                -ss 1 -i "staged/$lang/$name" -frames:v 1 "staged/$lang/cover.png"
              ffmpeg -hide_banner -nostdin -loglevel error -xerror \
                -i "staged/$lang/$name" -f null -
            done
          '
      - name: Pin exact approved hashes, validate subtitles and media, block all uploader routes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, re, subprocess
          from pathlib import Path
          cases=[
             ("en","fm_20261102_agent_permissions_short_en","FLOWMINUTE_ENGLISH_V6_AUDIO_MASTER_REVIEW_ONLY.mp4","flow-explain-english-phrase-captions.srt","1f1a740002aa035a1eaed8c7a308831efe0ea6a8950c61337ceaafda3a9386fc",1080,1920,896,13),
             ("hi","fm_20261102_agent_permissions_short_hi","FLOWMINUTE_HINDI_V2_AUDIO_MASTER_REVIEW_ONLY.mp4","flow-explain-hindi-phrase-captions.srt","ba27ed6b3af872b3c5973f4b371c6ff8abfb7885929def88d9e16dc890c0f772",1080,1920,1112,13),
             ("long","fm_20261102_agent_permissions_long_hi","FLOWMINUTE_HI_LONG_AUDIO_MASTER_REVIEW_ONLY.mp4","hindi-long-captions.srt","05cd121643df040727b9e8490341c4bf6e881d27728edea42e3c2de8aa16a213",1920,1080,3737,29),
          ]
          for lang,episode,name,srt,expected,w,h,frames,number in cases:
              folder=Path("staged")/lang
              video=folder/name
              digest=hashlib.sha256(video.read_bytes()).hexdigest()
              assert digest==expected,(lang,digest,expected)
              approval=json.loads((Path("state/approvals")/(episode+".json")).read_text())
              assert approval["candidate_video_sha256"]==digest
              assert approval["owner_publish_authorized"] is True
              assert approval["youtube_uploaded"] is False
              assert any(approval.get(k) is not True for k in ("human_voice_approved","exact_captions_approved","rights_cleared","factual_review_approved"))
              text=(folder/srt).read_text(encoding="utf-8-sig")
              assert len(re.findall(r"(?m)^\d+\s*$",text))==number
              p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type,codec_name,width,height,nb_frames","-of","json",str(video)],capture_output=True,text=True,check=True)
              streams=json.loads(p.stdout)["streams"]
              v=next(z for z in streams if z["codec_type"]=="video")
              a=next(z for z in streams if z["codec_type"]=="audio")
              assert (v["width"],v["height"],int(v["nb_frames"]))==(w,h,frames),(lang,v)
              assert v["codec_name"]=="h264" and a["codec_name"]=="aac"
              receipt={"status":"EXACT_BYTES_STAGED_ONLY_NO_PUBLISH","episode_id":episode,
                "video_sha256":digest,"video_name":name,"caption_name":srt,
                "owner_publish_authorized":True,"human_release_gates_complete":False,
                "youtube_uploaded":False,"youtube_video_id":None,
                "width":w,"height":h,"frames":frames,"caption_cues":number,
                "source":"verified original GitHub Actions Remotion render; deterministic FFmpeg audio master"}
              (folder/"staging_qa.json").write_text(json.dumps(receipt,indent=2)+"\n")
              print("EXACT_MASTER_STAGED",lang,digest)
          PY
      - name: Upload English Short reviewed binary for later authorized protected release
        uses: actions/upload-artifact@v4
        with:
          name: fm-20261102-approved-media-bytes-english-short
          path: staged/en/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload Hindi Short reviewed binary for later authorized protected release
        uses: actions/upload-artifact@v4
        with:
          name: fm-20261102-approved-media-bytes-hindi-short
          path: staged/hi/*
          retention-days: 30
          if-no-files-found: error
      - name: Upload Hindi long-form review binary (NOT creatively approved)
        uses: actions/upload-artifact@v4
        with:
          name: fm-20261102-review-media-bytes-hindi-long
          path: staged/long/*
          retention-days: 30
          if-no-files-found: error
