name: FlowMinute B4e4c REAL 2 Shorts + Long Floating Source Hero Videos (NO UPLOAD)

on:
  pull_request:
    paths:
      - "autopilot/full_topic_narrated_pack.py"
      - "autopilot/retain_floating_three_v6.py"
      - "autopilot/test_floating_full_video_bridge_v6.py"
      - ".github/workflows/flowminute-b4e4c-floating-three-video-review.yml"
      - "docs/adr/0048-b4e4c-actual-three-unboxed-video-render-proof.md"
  push:
    branches: [main]
    paths:
      - "autopilot/retain_floating_three_v6.py"
      - "autopilot/full_topic_narrated_pack.py"
      - ".github/workflows/flowminute-b4e4c-floating-three-video-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-b4e4c-real-floating-video-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native_before_after_visual_source_and_caption_integrity:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ENABLE_GEMINI: "0"
      FLOWMINUTE_MODEL_PAID_SPEND_USD: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local-only public scientific illustration, fonts, audio and FFmpeg dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2 libsndfile1
          python -m pip install --disable-pip-version-check \
            'Pillow>=11,<13' 'cairosvg>=2.7,<3' \
            'cryptography>=46,<48' \
            'numpy>=1.26,<3' 'soundfile>=0.12,<1'
      - name: Actual old/new frame pixel difference across Shorts and all five long shots
        run: |
          set -euo pipefail
          python -B -m py_compile \
            autopilot/floating_cinematic_v6.py \
            autopilot/test_b4e3c_aac_recovery.py \
            autopilot/test_floating_full_video_bridge_v6.py \
            autopilot/retain_floating_three_v6.py \
            autopilot/full_topic_narrated_pack.py
          python -B -m unittest -v \
            autopilot.test_floating_full_video_bridge_v6 \
            autopilot.test_cinematic_editorial_grid_v5 \
            autopilot.test_b4e3c_aac_recovery \
            autopilot.test_cinematic_scene_v3 \
            autopilot.test_polished_caption_v2 \
            autopilot.test_full_topic_narrated_pack \
            autopilot.test_polished_sound_design_v2 \
            2>&1 | tee /tmp/b4e3_native_qa.log
          if grep -E '^(FAILED|ERROR|.*skipped.*)$' /tmp/b4e3_native_qa.log; then exit 1; fi
          echo "B4E4C_FLOATING_FULL_32_SCENE_ART_AND_AAC_SAFE_ZONE_VOICE_SFX_TESTS_PASS"
      - name: No third-party reference, provider client, fake owner approval or paid cloud use
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for path in ("autopilot/floating_cinematic_v6.py",
                       "autopilot/retain_floating_three_v6.py"):
              root=ast.parse(Path(path).read_text())
              denied=("google","googleapiclient","boto3","botocore",
                      "requests","urllib","http","socket","aiohttp")
              for node in ast.walk(root):
                  if isinstance(node,ast.Import):
                      for x in node.names:
                          assert not x.name.startswith(denied),x.name
                  if isinstance(node,ast.ImportFrom):
                      assert not (node.module or "").startswith(denied),node.module
          print("B4E4C_ONLY_ORIGINAL_FLOATING_SOURCE_MEDIA_NO_YOUTUBE_UPLOAD")
          PY
          test "$PUBLISH_ENABLED" = false
          test "$FLOWMINUTE_ENABLE_PUBLISH" = 0
          test "$FLOWMINUTE_ENABLE_GEMINI" = 0
          test "$FLOWMINUTE_ALLOW_LAPTOP" = 0

  actually_render_review_2_shorts_and_one_long:
    # B4e7: retired floating v6: keep PR/main source and caption QA,
    # run the costly old full Kokoro/FFmpeg media only on manual owner dispatch.
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: [native_before_after_visual_source_and_caption_integrity]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ENABLE_GEMINI: "0"
      FLOWMINUTE_MODEL_PAID_SPEND_USD: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      MODEL_SHA256: ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c
      VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only CPU video narration rendering and captions stack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --disable-pip-version-check \
            'kokoro-onnx==0.6.1' 'soundfile>=0.12,<1' \
            'Pillow>=11,<13' 'numpy>=1.26,<3' \
            'cairosvg>=2.7,<3' 'cryptography>=46,<48'
          ffmpeg -hide_banner -filters 2>&1 | grep -F ass
      - name: Only checksum-pinned public voice model files, never save model to review archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/flowminute-b4e4c-public-kokoro
          cd /tmp/flowminute-b4e4c-public-kokoro
          root="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 \
            --output kokoro-v1.0.int8.onnx "$root/kokoro-v1.0.int8.onnx"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --output voices-v1.0.bin "$root/voices-v1.0.bin"
          printf '%s  %s\n' "$MODEL_SHA256" kokoro-v1.0.int8.onnx | sha256sum --check --strict
          printf '%s  %s\n' "$VOICES_SHA256" voices-v1.0.bin | sha256sum --check --strict
      - name: Actually encode and fully inspect three enhanced original videos
        run: |
          set -euo pipefail
          python -B -m autopilot.retain_floating_three_v6 \
            --model /tmp/flowminute-b4e4c-public-kokoro/kokoro-v1.0.int8.onnx \
            --voices /tmp/flowminute-b4e4c-public-kokoro/voices-v1.0.bin \
            --output /tmp/flowminute-b4e4c-3-video-review
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("/tmp/flowminute-b4e4c-3-video-review")
          manifest=json.loads((root/"UNAPPROVED_FLOATING_THREE_MANIFEST.json").read_text())
          assert manifest["status"]=="B4E4C_REAL_THREE_FLOATING_UNBOXED_CINEMATIC_PREVIEWS_UNAPPROVED"
          assert [x["format"] for x in manifest["episodes"]]==["short","long","short"]
          assert manifest["original_user_reference_clip_copied"] is False
          assert manifest["real_human_watch_listen_or_facts_reviewed"] is False
          assert manifest["voice_music_visual_license_reviewed"] is False
          assert manifest["real_youtube_published_videos"]==0
          assert manifest["release_authorized"] is False
          shas=set()
          for entry in manifest["episodes"]:
              assert entry["actual_original_2point5d_composited_into_mp4"] is True
              assert entry["actual_original_unboxed_2point5d_in_full_mp4"] is True
              assert entry["native_ass_captions_independently_verified"] is True
              assert entry["original_5_distinct_visual_compositions"] is True
              assert entry["real_modelled_3d_used"] is False
              assert entry["owner_creative_approval"] is False
              assert len(entry["actual_mp4_review_frames"])>=3
              files=entry["files"]+entry["actual_mp4_review_frames"]+[entry["same_source_before_after_art_proof"]]
              for item in files:
                  p=root/entry["episode_id"]/item["filename"]
                  assert p.is_file() and not p.is_symlink()
                  assert p.stat().st_size==item["bytes"]
                  with p.open("rb") as fh:
                      assert hashlib.file_digest(fh,"sha256").hexdigest()==item["sha256"]
              shas.add(entry["files"][0]["sha256"])
          assert len(shas)==3
          print("B4E4C_TWO_SHORTS_AND_LONG_REAL_FLOATING_H264_AAC_AUDITED_NO_YOUTUBE")
          PY
      - name: Retain actual two-Shorts-plus-long MP4, subtitles, new thumbnails and OLD-vs-NEW comparisons
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-b4e4c-2shorts-long-floating-unboxed-real-before-after-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/flowminute-b4e4c-3-video-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Always delete model weights and 3 unapproved preview source outputs
        if: always()
        run: |
          rm -rf /tmp/flowminute-b4e4c-public-kokoro \
            /tmp/flowminute-b4e4c-3-video-review
          echo "B4E4C_FLOATING_REAL_VIDEO_REVIEW_ONLY_NO_CHANNEL_PUBLISH_OR_OAUTH"
