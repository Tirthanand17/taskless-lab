name: Branch 3 Clivox A2 Private Ledger SHA-CAS (OFFLINE NO NETWORK)

on:
  pull_request:
    paths:
      - 'scripts/branch3_a2_private_ledger_cas.py'
      - 'scripts/test_branch3_a2_private_ledger_cas.py'
      - 'branch3/rights_review/**'
      - 'branch3/architecture/**'
      - '.github/workflows/branch3-clivox-a2-private-ledger-cas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a2-private-ledger-cas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove_private_ledger_contract_without_privileged_access:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_LEDGER_LIVE_GET_ENABLED: 'false'
      CLIVOX_LEDGER_LIVE_PUT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test-only cryptographic dependency; no GitHub private access
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<47'
      - name: Adversarial signature chain, blob-SHA and concurrency tests
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a2_private_ledger_cas.py scripts/test_branch3_a2_private_ledger_cas.py
          python -B -m unittest -v scripts.test_branch3_a2_private_ledger_cas scripts.test_branch3_a2_checkpointed_revocations scripts.test_branch3_a2_review_receipt scripts.test_branch3_media_storage_preflight
      - name: Verify fixture cannot connect to a private vault or publish
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a2_private_ledger_cas --mode fixture > "$RUNNER_TEMP/clivox-a2-private-cas.txt"
          python -B -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a2-private-cas.txt").read_text()); assert d["github_api_calls"]==0 and d["youtube_api_calls"]==0 and d["real_license_grants_verified"]==0 and d["live_github_contents_put_configured"] is False and d["real_external_checkpoint_pin_enrolled"] is False and d["creator_source_acquisition_authorized"] is False and d["youtube_upload_authorized"] is False and d["youtube_publish_authorized"] is False; print("CLIVOX_A2_PRIVATE_CAS_CONTRACT_NO_WRITES")'
      - name: Confirm NO branch token, rights, downloads or YouTube writes
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_LEDGER_LIVE_GET_ENABLED" = 'false'
          test "$CLIVOX_LEDGER_LIVE_PUT_ENABLED" = 'false'
      # No artifacts, no contract PDFs, no private repo metadata or credentials.
