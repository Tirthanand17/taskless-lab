name: FlowMinute B4e1 Reference-Led Caption Thumbnail SFX Redesign (NO PUBLISH)

on:
  pull_request:
    paths:
      - "autopilot/polished_caption_v2.py"
      - "autopilot/polished_thumbnail_v2.py"
      - "autopilot/polished_sound_design_v2.py"
      - "autopilot/retain_polished_shorts_v2.py"
      - "autopilot/test_polished_caption_v2.py"
      - "autopilot/test_polished_thumbnail_v2.py"
      - "autopilot/test_polished_sound_design_v2.py"
      - "autopilot/full_topic_narrated_pack.py"
      - ".github/workflows/flowminute-b4e1-quality-rescue.yml"
      - "docs/adr/0041-b4e1-real-reference-video-audio-and-visual-quality-analysis.md"
  push:
    branches: [main]
    paths:
      - "autopilot/polished_caption_v2.py"
      - "autopilot/polished_thumbnail_v2.py"
      - "autopilot/polished_sound_design_v2.py"
      - "autopilot/retain_polished_shorts_v2.py"
      - "autopilot/full_topic_narrated_pack.py"
      - ".github/workflows/flowminute-b4e1-quality-rescue.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-b4e1-video-quality-redesign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical_typography_image_and_synthetic_audio_quality_tests:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ENABLE_GEMINI: "0"
      FLOWMINUTE_MODEL_PAID_SPEND_USD: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free local typography/Pillow/numerical audio and font test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install --disable-pip-version-check \
            'cryptography>=46,<48' 'Pillow>=11,<13' \
            'numpy>=1.26,<3' 'soundfile>=0.12,<1'
          command -v ffmpeg
      - name: Execute real text timing, thumbnail pixel, procedural audio and old-source guards
        run: |
          set -euo pipefail
          python -B -m py_compile \
            autopilot/polished_caption_v2.py \
            autopilot/polished_thumbnail_v2.py \
            autopilot/polished_sound_design_v2.py \
            autopilot/retain_polished_shorts_v2.py \
            autopilot/full_topic_narrated_pack.py
          python -B -m unittest -v \
            autopilot.test_polished_caption_v2 \
            autopilot.test_polished_thumbnail_v2 \
            autopilot.test_polished_sound_design_v2 \
            autopilot.test_full_topic_narrated_pack \
            autopilot.test_primary_sourced_storyboards \
            2>&1 | tee /tmp/b4e1_quality_tests.log
          if grep -E '^(FAILED|ERROR|.*skipped.*)$' /tmp/b4e1_quality_tests.log; then exit 1; fi
      - name: Actually render a native 1080x1920 FFmpeg ASS caption proof frame
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          from autopilot.polished_caption_v2 import compose_ass
          cues=[{"start":0.0,"end":3.2,
                 "text":"Before they answer your voice becomes an electronic signal."}]
          raw,cards=compose_ass(cues,"short","lunar_signal")
          assert len(cards)>=2
          Path("/tmp/b4e1-native-typography.ass").write_text(raw,encoding="utf-8")
          PY
          ffmpeg -nostdin -hide_banner -loglevel error -f lavfi \
            -i "color=c=#071323:s=1080x1920:r=30:d=3" \
            -vf "ass=/tmp/b4e1-native-typography.ass" -ss 1 \
            -frames:v 1 -y /tmp/b4e1-caption-pixel-proof.png
          python -B - <<'PY'
          from PIL import Image
          import numpy as np
          image=np.asarray(Image.open("/tmp/b4e1-caption-pixel-proof.png").convert("RGB"))
          assert image.shape==(1920,1080,3)
          bright=(image[:,:,0]>135)&(image[:,:,1]>135)&(image[:,:,2]>135)
          assert int(bright[1340:1515,160:920].sum())>1000, "No readable native text in reserved zone"
          assert int(bright[:1260].sum())==0, "Subtitle escaped upward into illustration"
          assert int(bright[1650:].sum())==0, "Subtitle escaped into UI bottom overlay"
          print("B4E1_REAL_FFMPEG_PIXEL_NATIVE_ASS_TEXT_IN_SAFE_BAND_ONLY")
          PY
      - name: Refuse OAuth, copyrighted reference audio, live upload or paid agents
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ("autopilot/polished_caption_v2.py",
                       "autopilot/polished_thumbnail_v2.py",
                       "autopilot/polished_sound_design_v2.py"):
              root=ast.parse(Path(name).read_text())
              denied=("boto3","botocore","google","googleapiclient",
                      "requests","urllib","socket","aiohttp")
              for x in ast.walk(root):
                  if isinstance(x,ast.Import):
                      for y in x.names:
                          assert not y.name.startswith(denied),y.name
                  if isinstance(x,ast.ImportFrom):
                      assert not (x.module or "").startswith(denied),x.module
          print("B4E1_ONLY_ORIGINAL_SOURCE_AUDIO_AND_VECTOR_ART_NO_YOUTUBE_PROVIDER")
          PY
          test "$PUBLISH_ENABLED" = false
          test "$FLOWMINUTE_ENABLE_PUBLISH" = 0
          test "$FLOWMINUTE_ENABLE_GEMINI" = 0
          test "$FLOWMINUTE_MODEL_PAID_SPEND_USD" = 0

  two_actual_polished_shorts_for_owner_critique:
    # Source-only PR cannot trigger actual costly render, main only one proof.
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [physical_typography_image_and_synthetic_audio_quality_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ENABLE_GEMINI: "0"
      FLOWMINUTE_MODEL_PAID_SPEND_USD: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      MODEL_SHA256: ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c
      VOICES_SHA256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Hosted original voice/SVG/FFmpeg dependencies, never live YouTube
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1 fonts-dejavu-core
          python -m pip install --disable-pip-version-check \
            'kokoro-onnx==0.6.1' 'soundfile>=0.12,<1' \
            'Pillow>=11,<13' 'numpy>=1.26,<3' 'cairosvg>=2.7,<3' \
            'cryptography>=46,<48'
          ffmpeg -hide_banner -filters 2>&1 | grep -F ass
      - name: Download only existing SHA-pinned public non-licensed-for-release voice/model inputs
        run: |
          set -euo pipefail
          mkdir -p /tmp/flowminute-b4e1-voice
          cd /tmp/flowminute-b4e1-voice
          root="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 \
            --output kokoro-v1.0.int8.onnx "$root/kokoro-v1.0.int8.onnx"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 180 \
            --output voices-v1.0.bin "$root/voices-v1.0.bin"
          printf '%s  %s\n' "$MODEL_SHA256" kokoro-v1.0.int8.onnx | sha256sum --check --strict
          printf '%s  %s\n' "$VOICES_SHA256" voices-v1.0.bin | sha256sum --check --strict
      - name: Actually render and decode redesigned two Shorts with new captions thumbs SFX
        run: |
          set -euo pipefail
          python -B -m autopilot.retain_polished_shorts_v2 \
            --model /tmp/flowminute-b4e1-voice/kokoro-v1.0.int8.onnx \
            --voices /tmp/flowminute-b4e1-voice/voices-v1.0.bin \
            --output /tmp/flowminute-b4e1-polished-review
          python -B - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("/tmp/flowminute-b4e1-polished-review")
          m=json.loads((d/"UNAPPROVED_B4E1_POLISHED_TWO_SHORTS_MANIFEST.json").read_text())
          assert m["status"]=="B4E1_TWO_REAL_POLISHED_SHORTS_UNAPPROVED_REVIEW_ONLY"
          assert len(m["videos"])==2
          assert all(x["format"]=="short" for x in m["videos"])
          assert not m["original_reference_audio_or_graphics_imported"]
          assert m["real_owner_full_watch_listen_and_claim_review"] is False
          assert m["release_authorized"] is False
          assert m["real_youtube_uploads"]==0
          for entry in m["videos"]:
              assert entry["original_technical_scene_ui_effects_count"]==5
              assert len(entry["visual_review_frames"])==2
              for f in entry["files"]+entry["visual_review_frames"]:
                  p=d/entry["episode_id"]/f["filename"]
                  assert p.is_file() and not p.is_symlink()
                  assert p.stat().st_size==f["bytes"]
                  with p.open("rb") as fh:
                      assert hashlib.file_digest(fh,"sha256").hexdigest()==f["sha256"]
          print("B4E1_REAL_TWO_UNAPPROVED_SHORTS_NATIVE_CAPTION_THUMBS_SFX_AND_REVIEW_FRAMES_PHYSICAL_SHA_VERIFIED")
          PY
      - name: Retain two FULL unapproved redesigned Shorts plus 4 real 4s and 16s review frames
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-b4e1-real-polished-two-shorts-unapproved-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/flowminute-b4e1-polished-review/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Clear hosted temporary voice assets and actual rendered media
        if: always()
        run: |
          rm -rf /tmp/flowminute-b4e1-voice \
            /tmp/flowminute-b4e1-polished-review
          echo 'B4E1_EPHEMERAL_CLEANUP_NO_YOUTUBE_UPLOAD_OR_OWNER_CONSENT'
