name: FlowMinute Branch1 OWNER Nov05-11 ReadOnly YouTube Schedule (NO UPLOAD)

on:
  pull_request:
    paths:
      - "autopilot/branch1_owner_schedule_readonly_v6.py"
      - "autopilot/test_branch1_owner_schedule_readonly_v6.py"
      - "scripts/branch1_owner_schedule_readonly_v6.py"
      - ".github/workflows/flowminute-b1-owner-youtube-readonly-nov.yml"
      - "docs/adr/0055-b1q6-protected-schedule-inventory.md"
  push:
    branches: [main]
    paths:
      - "autopilot/branch1_owner_schedule_readonly_v6.py"
      - "autopilot/test_branch1_owner_schedule_readonly_v6.py"
      - "scripts/branch1_owner_schedule_readonly_v6.py"
      - ".github/workflows/flowminute-b1-owner-youtube-readonly-nov.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-b1-owner-readonly-nov05-11-${ github.ref }}
  cancel-in-progress: false

jobs:
  readonly_contract_tests_without_owner_credentials:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify synthetic read-only contracts, conflicts and privacy boundaries
        run: |
          set -euo pipefail
          python -B -m py_compile \
            autopilot/branch1_owner_schedule_readonly_v6.py \
            autopilot/test_branch1_owner_schedule_readonly_v6.py \
            scripts/branch1_owner_schedule_readonly_v6.py
          python -B -m unittest -v \
            autopilot.test_branch1_owner_schedule_readonly_v6 \
            autopilot.test_branch1_nov_short_repair \
            2>&1 | tee /tmp/fm-owner-youtube-readonly-offline.log
          if grep -E '^(FAILED|ERROR|.*skipped.*)$' /tmp/fm-owner-youtube-readonly-offline.log; then exit 1; fi
          echo "B1Q6_OFFLINE_SYNTHETIC_21_SLOTS_NEVER_REMOTE_ATTESTATION"
      - name: Refuse YouTube insert update delete upload implementation
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in ("autopilot/branch1_owner_schedule_readonly_v6.py",
                       "scripts/branch1_owner_schedule_readonly_v6.py"):
              tree=ast.parse(Path(name).read_text(encoding="utf8"))
              forbidden=("insert","update","delete","upload","rate","subscriptions")
              for node in ast.walk(tree):
                  if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute):
                      assert node.func.attr not in forbidden, (name,node.func.attr)
          print("B1Q6_ONLY_OWNER_CHANNEL_PLAYLIST_VIDEO_READ_CALLS")
          PY

  authenticated_owner_readonly_calendar:
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [readonly_contract_tests_without_owner_credentials]
    runs-on: ubuntu-24.04
    environment: youtube-production
    timeout-minutes: 16
    env:
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      YOUTUBE_TOKEN_JSON: ${ secrets.YOUTUBE_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure approved protected owner OAuth exists without printing it
        run: |
          set -euo pipefail
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::error::OWNER_TOKEN_NOT_CONFIGURED_OR_ENVIRONMENT_APPROVAL_REQUIRED"
            exit 2
          fi
          test "$GITHUB_REF" = "refs/heads/main"
          test "$FLOWMINUTE_ENABLE_PUBLISH" = "0"
          test "$PUBLISH_ENABLED" = "false"
      - name: Install only official Google OAuth and read-only API clients
        run: |
          python -m pip install --disable-pip-version-check \
            'google-api-python-client>=2.150,<3' 'google-auth>=2.35,<3'
      - name: Authenticate channel and read complete 21-slot owner calendar
        run: |
          set -euo pipefail
          python -B -m scripts.branch1_owner_schedule_readonly_v6
          test -s "$RUNNER_TEMP/FLOWMINUTE_OWNER_READONLY_REDACTED_NOV05_11.json"
      - name: Retain redacted slot counts only, not private video IDs or titles
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-owner-readonly-21-slots-redacted-${ github.run_id }}-${ github.run_attempt }}
          path: ${ runner.temp }}/FLOWMINUTE_OWNER_READONLY_REDACTED_NOV05_11.json
          if-no-files-found: error
          retention-days: 1
      - name: Destroy ephemeral schedule on protected runner
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/FLOWMINUTE_OWNER_READONLY_REDACTED_NOV05_11.json"
          echo "B1Q6_READONLY_ONLY_NO_OLD_VIDEO_EDIT_DELETE_RESCHEDULE_OR_UPLOAD"
