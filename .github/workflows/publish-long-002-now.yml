name: Publish Long 002 Now

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-long-002-now.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact QA-passed render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh run download "37631795801" \
            --repo "$GITHUB_REPOSITORY" \
            --name "flowminute-long-002" \
            --dir incoming
          test -f "incoming/invisible-excel-long-002.mp4"
          test -f "incoming/thumbnail-long-002.png"

      - name: Validate release metadata
        run: python scripts/validate_release.py content/episodes/long_002.json

      - name: Install YouTube API client
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Publish exact artifact to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: "true"
        run: |
          python scripts/publish_youtube.py \
            --episode content/episodes/long_002.json \
            --video incoming/invisible-excel-long-002.mp4 \
            --captions incoming/captions-long-002.srt \
            --thumbnail incoming/thumbnail-long-002.png \
            --privacy public \
            --receipt state/published/long_002.json \
            --confirm-publish

      - name: Commit publication receipt
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/published/long_002.json
          git commit -m "Record long_002 YouTube publication" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
