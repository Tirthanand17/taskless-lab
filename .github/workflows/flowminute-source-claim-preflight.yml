name: FlowMinute B3d3a Exact Source Claim Preflight (NO PUBLISH)

on:
  pull_request:
    paths:
      - "autopilot/source_claim_preflight.py"
      - "autopilot/test_source_claim_preflight.py"
      - "autopilot/narration_review_inventory.py"
      - "autopilot/script_continuity_gate.py"
      - ".github/workflows/flowminute-source-claim-preflight.yml"
      - "docs/adr/0014-b3d3a-source-excerpt-and-script-surface-review.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-b3d3a-source-review-no-publish
  cancel-in-progress: true

jobs:
  exact_source_and_script_claims:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CI: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
    steps:
      - name: Checkout PR code without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up public-hosted Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public Ed25519 signature verifier
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=46,<48'
      - name: Run exact-article evidence, signed script and all-surface claim regressions
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            autopilot.test_claim_review_dossier \
            autopilot.test_script_continuity_gate \
            autopilot.test_narration_review_inventory \
            autopilot.test_source_claim_preflight
      - name: Prove no editorial approval or YouTube permissions are granted
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from autopilot.test_source_claim_preflight import surface_packet, accepted_excerpt, draft_claim
          from autopilot.source_claim_preflight import atomic_claim_docket
          excerpt=accepted_excerpt()
          for i in range(3):
              packet=surface_packet(i)
              result=atomic_claim_docket(packet,[draft_claim(packet,excerpt)],[excerpt]) if i==0 else atomic_claim_docket(packet,[],[])
              assert packet["all_defined_script_surfaces_present"] is True
              assert packet["all_defined_surfaces_reviewed"] is False
              assert packet["youtube_upload_enabled"] is False
              assert result["atomic_claims_exhaustive"] is False
              assert result["independent_factual_and_legal_review_complete"] is False
              assert result["render_authorized"] is False
              assert result["youtube_upload_enabled"] is False
              assert result["youtube_schedule_enabled"] is False
              assert result["release_authorized"] is False
          print("B3D3A_SOURCE_BYTES_AND_SCRIPT_SURFACES_PENDING_NO_FACT_APPROVAL_NO_PUBLISH")
          PY
