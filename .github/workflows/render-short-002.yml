name: Render Short 002

on:
  push:
    paths:
      - "content/episodes/short_002.json"
      - "scripts/render_manifest_short.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install pillow edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate episode
        run: python scripts/validate_release.py content/episodes/short_002.json
      - name: Render episode
        run: python scripts/render_manifest_short.py content/episodes/short_002.json
      - name: Remove intermediates
        run: rm -rf assets/short_002/_render
      - name: Commit assets
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/short_002
          git diff --cached --quiet && exit 0
          git commit -m "Render Short 002 assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
