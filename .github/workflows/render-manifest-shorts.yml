name: Render Manifest Shorts

on:
  push:
    paths:
      - "content/episodes/short_*.json"
      - "scripts/render_manifest_short.py"
      - "scripts/render_all_manifest_shorts.py"
      - "scripts/validate_release.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install pillow edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate manifests
        shell: bash
        run: |
          shopt -s nullglob
          for f in content/episodes/short_*.json; do
            python scripts/validate_release.py "$f"
          done
      - name: Render manifest episodes
        run: python scripts/render_all_manifest_shorts.py
      - name: Remove render intermediates
        run: find assets -type d -name _render -prune -exec rm -rf {} +
      - name: Commit rendered assets
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/short_*
          git diff --cached --quiet && exit 0
          git commit -m "Render manifest Shorts"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
