name: Branch 3 Clivox Integrated Original-Only Rehearsal (NO UPLOAD)

on:
  pull_request:
    paths:
      - 'scripts/branch3_integrated_rehearsal.py'
      - 'scripts/test_branch3_integrated_rehearsal.py'
      - 'branch3/integration/**'
      - '.github/workflows/branch3-clivox-integration-rehearsal.yml'
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Synthetic no-license demo resolution'
        required: true
        type: choice
        options: [preview, full]
        default: preview

permissions:
  contents: read

concurrency:
  group: clivox-integration-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render_validate_quarantine_no_youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_CREATOR_SOURCE_DOWNLOAD_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only media QA and temporary test dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0 'cryptography>=44,<47'
          command -v ffmpeg
          command -v ffprobe
      - name: Adversarial unit tests for every integration boundary
        run: |
          python -B -m py_compile scripts/branch3_integrated_rehearsal.py scripts/test_branch3_integrated_rehearsal.py
          python -B -m unittest -v scripts.test_branch3_integrated_rehearsal scripts.test_branch3_a4_editorial scripts.test_branch3_a5_media scripts.test_branch3_a6_signed_release scripts.test_branch3_a8_private_first_dryrun
      - name: Produce original-only 40-second MP4 on ephemeral GitHub runner
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'preview' || inputs.resolution || 'preview' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clivox-integration"
          python -B -m scripts.branch3_a5_render_original_demo --input branch3/editorial/fixtures/ymh_ep347_source_free.json --output "$RUNNER_TEMP/clivox-integration" --mode "$MODE"
          python -B -m scripts.branch3_a5_media_qa --directory "$RUNNER_TEMP/clivox-integration"
      - name: Verify real MP4/SRT/FFprobe evidence against quarantine and scheduling
        run: |
          python -B -m scripts.branch3_integrated_rehearsal --directory "$RUNNER_TEMP/clivox-integration" --report "$RUNNER_TEMP/clivox-integration/integrated-source-free-rehearsal-report.json"
          python -B -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-integration/integrated-source-free-rehearsal-report.json"; r=json.loads(p.read_text()); assert len(r["stages_verified"])==4 and not r["real_licensed_pilot_completed"] and not r["youtube_upload_authorized"] and not r["youtube_schedule_authorized"] and not r["youtube_publish_authorized"] and r["google_oauth_or_youtube_network_calls"]==0; print("CLIVOX_INTEGRATED_REAL_MEDIA_QA_QUARANTINED_NO_UPLOAD")'
      - name: Publish original demo preview only (NEVER third-party media)
        uses: actions/upload-artifact@v4
        with:
          name: clivox-original-only-integrated-rehearsal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clivox-integration/clivox-original-only-a5-demo.mp4
            ${{ runner.temp }}/clivox-integration/on-screen-editorial-script-not-dialogue.srt
            ${{ runner.temp }}/clivox-integration/synthetic-demo-manifest.json
            ${{ runner.temp }}/clivox-integration/synthetic-technical-qa-report.json
            ${{ runner.temp }}/clivox-integration/integrated-source-free-rehearsal-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify still no live rights or publication
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_CREATOR_SOURCE_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          echo 'Original-only technical benchmark; no source rights, licensing, voiceover, uploads or scheduling.'
