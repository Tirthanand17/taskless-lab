name: FlowMinute B1 Actual Calc and Chrome Demos (NO YOUTUBE)

on:
  pull_request:
    paths:
      - "autopilot/branch1_real_app_capture.py"
      - "autopilot/test_branch1_real_app_capture.py"
      - "content/recovery_pilot/real_calc_trim_short.json"
      - "content/recovery_pilot/real_chrome_notifications_short.json"
      - "docs/BRANCH1_REAL_CALC_CHROME_PILOTS.md"
      - ".github/workflows/branch1-real-calc-chrome-demo-qa.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: b1-actual-apps-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  offline_creative_and_receipt_tests:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test actual-app plans, identity and zero-release gates
        run: |
          set -euo pipefail
          python -B -m py_compile \
            autopilot/branch1_real_app_capture.py \
            autopilot/test_branch1_real_app_capture.py
          python -B -m unittest -v \
            autopilot.test_branch1_real_app_capture \
            autopilot.test_branch1_recovery
          python -B - <<'PY'
          from autopilot.branch1_real_app_capture import APPS, plan
          for app in sorted(APPS):
              brief,summary=plan(app)
              assert summary["opening_proof_by_seconds"] <= 2
              assert summary["first_real_action_at_seconds"] <= 3
              assert summary["owner_approval"] is False
              assert summary["youtube_uploads"] == 0
              print("CREATIVE_PLAN_VALIDATED_NOT_RELEASE_APPROVED",app,brief["episode_id"])
          PY
      - name: Refuse uploader integration and user profile use
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          source=Path("autopilot/branch1_real_app_capture.py").read_text()
          for denied in ("youtube.videos().insert", "status.publishAt",
                         "googleapiclient", "oauth2", "publish_youtube(",
                         "studio.youtube.com"):
              assert denied not in source, denied
          assert "personal_profile_used" in source
          assert "FLOWMINUTE_ENABLE_PUBLISH" in source
          print("NO_CHANNEL_MUTATIONS_NO_PERSONAL_CHROME_PROFILE")
          PY

  capture_both_actual_applications:
    if: >-
      github.repository == 'Tirthanand17/taskless-lab' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    needs: [offline_creative_and_receipt_tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        app: [calc, chrome]
    env:
      GITHUB_ACTIONS: "true"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      DEMO_APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source screen capture and real spreadsheet/browser drivers
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb ffmpeg xdotool fonts-dejavu-core \
            libreoffice-calc python3-uno
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            'selenium>=4.25,<5'
          if [ "$DEMO_APP" = chrome ]; then
            command -v google-chrome || command -v google-chrome-stable
          else
            command -v libreoffice
            /usr/bin/python3 -c 'import uno; print("UNO_MODULE_AVAILABLE")'
          fi
      - name: Record executed software, not an illustrated app mock
        run: |
          set -euo pipefail
          python -B -m autopilot.branch1_real_app_capture \
            --app "$DEMO_APP" \
            --out "/tmp/flowminute-actual-$DEMO_APP"
      - name: Independent exact-file receipt and final full-video decode
        run: |
          set -euo pipefail
          python -B -m autopilot.branch1_real_app_capture \
            --app "$DEMO_APP" --verify \
            --out "/tmp/flowminute-actual-$DEMO_APP"
          for media in \
            "/tmp/flowminute-actual-$DEMO_APP/ACTUAL_REAL_APPLICATION_CAPTURE.mp4" \
            "/tmp/flowminute-actual-$DEMO_APP/PROOF_FIRST_SILENT_REVIEW_ONLY.mp4"; do
            ffmpeg -nostdin -hide_banner -loglevel error -xerror \
              -i "$media" -f null -
          done
      - name: Keep exact review-only source evidence for 3 days
        uses: actions/upload-artifact@v4
        with:
          name: b1-REAL-${{ matrix.app }}-REVIEW-ONLY-${{ github.run_id }}
          path: |
            /tmp/flowminute-actual-${{ matrix.app }}/ACTUAL_REAL_APPLICATION_CAPTURE.mp4
            /tmp/flowminute-actual-${{ matrix.app }}/PROOF_FIRST_SILENT_REVIEW_ONLY.mp4
            /tmp/flowminute-actual-${{ matrix.app }}/REAL_APP_SOURCE_HASH_BOUND_UNAPPROVED.json
            /tmp/flowminute-actual-${{ matrix.app }}/application_observation.json
            /tmp/flowminute-actual-${{ matrix.app }}/ACTUAL_CALC_VALIDATED.ods
          retention-days: 3
          if-no-files-found: error
          compression-level: 2
      - name: Destroy source evidence and ephemeral browser profile from runner
        if: always()
        run: |
          rm -rf "/tmp/flowminute-actual-$DEMO_APP"
          echo "NO GOOGLE ACCOUNT, NO YOUTUBE UPLOAD, NO SCHEDULED VIDEO, NO LAPTOP MEDIA"
