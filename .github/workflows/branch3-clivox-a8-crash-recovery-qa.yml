name: Branch 3 Clivox A8 Crash and Ambiguous Upload Recovery Matrix (NO NETWORK)

on:
  pull_request:
    paths:
      - 'scripts/branch3_a8_crash_recovery.py'
      - 'scripts/test_branch3_a8_crash_recovery.py'
      - 'scripts/branch3_a8_private_cas_ledger.py'
      - 'scripts/branch3_a8_exhaustive_inventory.py'
      - 'branch3/a8/**'
      - 'branch3/architecture/**'
      - '.github/workflows/branch3-clivox-a8-crash-recovery-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a8-crash-recovery-no-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_every_crash_outcome_fails_closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_OWNER_SIGNED_RELEASES_AVAILABLE: 'false'
      CLIVOX_REAL_PRIVATE_CAS_WRITER_DEPLOYED: 'false'
      CLIVOX_GOOGLE_OAUTH_ACTIVE: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_BLIND_RETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax plus strict ledger, bounded YouTube inventory and recovery adversarial tests
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a8_crash_recovery.py scripts/test_branch3_a8_crash_recovery.py
          python -B -m unittest -v scripts.test_branch3_a8_crash_recovery scripts.test_branch3_a8_private_cas_ledger scripts.test_branch3_a8_exhaustive_inventory scripts.test_branch3_a8_cas_sandbox_writer
      - name: Replay deterministic 32 multi-worker schedules and prove no upload or blind retry
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a8_crash_recovery --mode fixture > "$RUNNER_TEMP/clivox-a8-crash-recovery.json"
          python -B -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a8-crash-recovery.json").read_text()); assert d["synthetic_scenarios_exercised"]==32 and d["max_worker_count"]==12 and d["all_scenarios_one_model_reservation_only"] and d["all_scenarios_never_retry_or_upload"] and not d["real_global_cas_writer_deployed"] and not d["external_rollback_resistant_anchor_enrolled"] and not d["real_upload_receipt_reconciled"] and not d["real_owner_video_release_approved"] and not d["youtube_video_insert_authorized"] and not d["youtube_schedule_authorized"] and not d["youtube_publish_authorized"] and d["actual_github_api_calls"]==0 and d["actual_google_api_calls"]==0; print("CLIVOX_A8_RECOVERY_MATRIX_ALL_HOLD_NO_YOUTUBE_OR_REMOTE_WRITES")'
      - name: Explicitly deny real owner rights, CAS credentials and posting
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_OWNER_SIGNED_RELEASES_AVAILABLE" = 'false'
          test "$CLIVOX_REAL_PRIVATE_CAS_WRITER_DEPLOYED" = 'false'
          test "$CLIVOX_GOOGLE_OAUTH_ACTIVE" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_BLIND_RETRY_ENABLED" = 'false'
      # No protected environment, third-party media, private video IDs,
      # Google OAuth or remote GitHub contents writes in this workflow.
