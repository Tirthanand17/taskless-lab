name: CLIVOX V2 P2/P3 Public Route Owner Pilot and Unsigned Licensing QA

on:
  pull_request:
    paths:
      - 'scripts/branch3_v2_p3_licensing_scope_quarantine.py'
      - 'scripts/test_branch3_v2_p3_licensing_scope_quarantine.py'
      - 'scripts/branch3_v2_p2p3_pilot_owner_review.py'
      - 'scripts/test_branch3_v2_p2p3_pilot_owner_review.py'
      - 'scripts/test_branch3_v2_p2p3_adversarial_release_hardening.py'
      - 'scripts/branch3_v2_p2p3_owner_decision_matrix.py'
      - 'scripts/test_branch3_v2_p2p3_owner_decision_matrix.py'
      - 'branch3/clipping_v2/prospects/p2p3-public-route-review-2026-11-14.json'
      - 'branch3/clipping_v2/P2P3_*'
      - 'branch3/clipping_v2/architecture-status.json'
      - '.github/workflows/branch3-clivox-v2-p3-licensing-scope.yml'
      - 'branch3/clipping_v2/P3_*'
  push:
    branches: [main]
    paths:
      - 'scripts/branch3_v2_p3_licensing_scope_quarantine.py'
      - 'scripts/test_branch3_v2_p3_licensing_scope_quarantine.py'
      - 'scripts/branch3_v2_p2p3_pilot_owner_review.py'
      - 'scripts/test_branch3_v2_p2p3_pilot_owner_review.py'
      - 'scripts/test_branch3_v2_p2p3_adversarial_release_hardening.py'
      - 'scripts/branch3_v2_p2p3_owner_decision_matrix.py'
      - 'scripts/test_branch3_v2_p2p3_owner_decision_matrix.py'
      - 'branch3/clipping_v2/prospects/p2p3-public-route-review-2026-11-14.json'
      - 'branch3/clipping_v2/P2P3_*'
      - 'branch3/clipping_v2/architecture-status.json'
      - '.github/workflows/branch3-clivox-v2-p3-licensing-scope.yml'
      - 'branch3/clipping_v2/P3_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-v2-p3-quarantine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned_scope_pending:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLIVOX_CREATOR_CONTACT_ENABLED: 'false'
      CLIVOX_LICENSE_GRANT_CREATION_ENABLED: 'false'
      CLIVOX_AUTO_DOWNLOAD_ENABLED: 'false'
      CLIVOX_AUTO_UPLOAD_ENABLED: 'false'
      PUBLISH_ENABLED: 'false'
    steps:
      - name: Source checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python standard library and no Google/Twitch credentials
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install A2 offline crypto test dependency
        run: |
          python -m pip install "cryptography==46.0.3"
      - name: Verify P2 and A2+P3 negative input and ownership cases
        run: |
          set -euo pipefail
          test "$CLIVOX_CREATOR_CONTACT_ENABLED" = "false"
          test "$CLIVOX_LICENSE_GRANT_CREATION_ENABLED" = "false"
          test "$CLIVOX_AUTO_DOWNLOAD_ENABLED" = "false"
          test "$CLIVOX_AUTO_UPLOAD_ENABLED" = "false"
          test "$PUBLISH_ENABLED" = "false"
          python -B -m unittest -v \
            scripts.test_branch3_v2_p2p3_pilot_owner_review \
            scripts.test_branch3_v2_p2p3_adversarial_release_hardening \
            scripts.test_branch3_v2_p2p3_owner_decision_matrix \
            scripts.test_branch3_v2_p3_licensing_scope_quarantine \
            scripts.test_branch3_v2_creator_prospect_intake \
            scripts.test_branch3_rights_case_intake \
            scripts.test_branch3_a2_review_receipt
      - name: Generate only temporary unsigned scope and unlinked source refs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clivox-p3-quarantine"
          python -B -m scripts.branch3_v2_p3_licensing_scope_quarantine \
            --input branch3/clipping_v2/prospects/public-business-pages-2026-11-14.json \
            --out "$RUNNER_TEMP/clivox-p3-quarantine/clivox-v2-p3-unsigned-license-scope-HOLD.json"
      - name: Independently verify quarantine, separated source and no rights
        run: |
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          packet=json.loads((Path(os.environ["RUNNER_TEMP"])/
            "clivox-p3-quarantine/clivox-v2-p3-unsigned-license-scope-HOLD.json").read_text())
          assert packet["stage"]=="CLIVOX_V2_P3_CONTRACT_SCOPE_INTAKE_QUARANTINED"
          assert packet["channel_id"]=="UCfPEvy0SefE_5nNlYlY_CyQ"
          assert packet["research_prospects_count"]==5
          assert packet["unsigned_requests_generated"]==5
          assert packet["rights_scope_checks_per_prospect"]>=25
          assert packet["creator_legal_identity_authenticated"] is False
          assert packet["creator_to_source_ownership_authenticated"] is False
          assert packet["actually_signed_contracts_received"]==0
          assert packet["actual_creator_grants_verified"]==0
          assert packet["owner_review_completed"] is False
          assert packet["real_reviewer_key_enrolled"] is False
          assert packet["real_revocation_head_pinned"] is False
          assert packet["private_legal_vault_approved"] is False
          assert packet["source_footage_delivered"] is False
          assert packet["media_acquisition_authorized"] is False
          assert packet["clivox_youtube_upload_authorized"] is False
          assert packet["clivox_youtube_publish_authorized"] is False
          assert packet["youtube_api_calls"]==0
          assert packet["creator_outreach_calls"]==0
          assert packet["source_media_downloads"]==0
          assert packet["public_output_contains_private_contracts"] is False
          assert packet["source_case_binding_policy"]=="NO_CROSSWALK_UNTIL_INDEPENDENT_HUMAN_IDENTITY"
          assert all(r["creator_has_been_contacted"] is False
                     and r["creator_signed_grant_received"] is False
                     and r["licensing_authorized"] is False
                     and r["source_video_id"] is None
                     and r["a2_pending_source_case_id"] is None
                     and r["youtube_upload_authorized"] is False
                     and r["unsigned_scope_request"]["no_license_granted"] is True
                     and all(v=="PENDING_HUMAN_AUTHENTICATION_NO_GRANT"
                             for v in r["checklist"].values())
                     for r in packet["prospect_scope_review_queue"])
          demo=packet["separate_unlinked_synthetic_a2_cases"]
          assert demo["a1_synthetic"] is True
          assert demo["real_source_licenses"]==0
          assert demo["source_case_count"]==2
          assert all(x["synthetic_fixture"] is True
                     and x["potential_creator_prospect_id"] is None
                     and x["ready_for_media_acquisition"] is False
                     and x["source_license_exists"] is False
                     for x in demo["synthetic_cases_only"])
          print("CLIVOX_V2_P3_SCOPE_PENDING_NO_CONTACT_NO_MEDIA_NO_WRITES")
          PY
      - name: Verify fresh five public route observations and generate strictly UNSENT three-option owner pilot review
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p2p3_pilot_owner_review --mode closed
          mkdir -p "$RUNNER_TEMP/clivox-p2p3-owner-review"
          python -B -m scripts.branch3_v2_p2p3_pilot_owner_review \
            --mode review \
            --out "$RUNNER_TEMP/clivox-p2p3-owner-review/clivox-v2-p2p3-pilot-owner-review-UNSENT.json" \
            > "$RUNNER_TEMP/clivox-p2p3-owner-review/public-qa-NO-CONTACT.json"
          python -B - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          from scripts.branch3_v2_creator_prospect_intake import DATA, load_watchlist
          from scripts.branch3_v2_p2p3_pilot_owner_review import (
              FIRST, OUT_NAME, STAGE, load_public_route_audit,
              validate_owner_packet, validate_public_route_audit,
              production_contact_license_or_clip, PilotDenied,
          )
          from scripts.branch3_a2_review_receipt import (
              POLICY, REGISTRY, read_json,
          )
          root = Path(os.environ["RUNNER_TEMP"]) / "clivox-p2p3-owner-review"
          safe = json.loads((root / "public-qa-NO-CONTACT.json").read_text("utf-8"))
          assert safe["stage"] == STAGE
          assert safe["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert safe["research_review_first_count"] == 3
          assert safe["other_research_or_deferred_count"] == 2
          assert safe["outreach_sent"] == 0 and safe["creator_rights_granted"] == 0
          assert safe["media_downloads"] == safe["youtube_uploads"] == 0
          assert safe["owner_human_approval_verified"] is False
          assert safe["pilot_drafts_created_in_ephemeral_dir_only"] is True
          packet = json.loads((root / OUT_NAME).read_text("utf-8"))
          watch = load_watchlist(DATA)
          audit = load_public_route_audit()
          now = datetime.now(timezone.utc)
          validate_public_route_audit(audit, watch, now=now)
          validate_owner_packet(
              packet, watchlist=watch, public_audit=audit,
              policy=read_json(POLICY), registry=read_json(REGISTRY), now=now)
          assert packet["stage"] == STAGE
          assert packet["owner_review_first_count"] == 3
          assert [x["prospect_id"] for x in packet["owner_review_first_options"]] == list(FIRST)
          assert len(packet["deferred_or_format_only_options"]) == 2
          assert packet["all_proposals_unsent"] is True
          assert packet["all_owner_shortlist_selections_unapproved"] is True
          assert packet["all_legal_creator_identities_unverified"] is True
          assert packet["all_source_rights_and_guest_music_game_not_cleared"] is True
          assert packet["creator_messages_sent"] == 0
          assert packet["creator_replies_received"] == 0
          assert packet["authenticated_licenses_received"] == 0
          assert packet["creator_source_files_delivered"] == 0
          assert packet["youtube_uploads"] == 0
          assert packet["owner_release_signed"] is False
          assert packet["licensing_authorized"] is False
          assert packet["media_download_authorized"] is False
          assert packet["video_editing_authorized"] is False
          assert packet["youtube_upload_authorized"] is False
          assert packet["youtube_publish_authorized"] is False
          assert packet["unsigned_negotiation_terms"]["no_license_granted"] is True
          assert packet["unsigned_negotiation_terms"]["request_only_not_agreement"] is True
          assert all(x["recipient_address"] is None
                     and x["allow_contact"] is False
                     and x["allow_source_download"] is False
                     and x["allow_upload"] is False
                     and x["rights_checklist_pending_count"] >= 25
                     for x in packet["owner_review_first_options"]+
                              packet["deferred_or_format_only_options"])
          assert "@" not in json.dumps(packet)
          try:
              production_contact_license_or_clip()
              raise AssertionError("Outreach action should be blocked")
          except PilotDenied:
              pass
          print("CLIVOX_V2_P2P3_FIVE_PUBLIC_ROUTE_PAGES_THREE_UNSENT_OWNER_OPTIONS_ZERO_LICENSES_MEDIA_CONTACTS_UPLOADS")
          PY
      - name: Generate ephemeral rights decision matrix with all gates closed
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p2p3_owner_decision_matrix \\
            --out "$RUNNER_TEMP/clivox-p2p3-owner-review/clivox-v2-p2p3-owner-decision-matrix-HOLD.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'clivox-p2p3-owner-review/clivox-v2-p2p3-owner-decision-matrix-HOLD.json'
          doc=json.loads(path.read_text())
          assert doc['all_actions_blocked'] is True and doc['prospects_total']==5
          assert doc['creator_outreach_sent']==doc['licensed_media_delivered']==doc['youtube_uploads']==0
          assert all(row['status']=='BLOCKED_PENDING_HUMAN_SELECTION_IDENTITY_AND_COMMERCIAL_GRANT'
                     and row['outreach_authorized'] is False
                     and row['youtube_upload_authorized'] is False
                     for row in doc['rows'])
          print('CLIVOX_P2P3_MATRIX_ALL_FIVE_BLOCKED')
          PY
      - name: Never upload legal documents or owner questionnaire artifacts
        run: |
          echo 'Ephemeral unsigned scope only; A2 locked; no creator outreach or source media.'
