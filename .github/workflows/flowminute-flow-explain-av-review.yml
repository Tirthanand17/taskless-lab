name: FLOWMINUTE FLOW EXPLAIN Full A/V Render Review (no publish)

on:
  push:
    branches:
      - "feature/oct24-multicharacter-3d-lesson-contract"
    paths:
      - "scripts/generate_flow_explain_timed_narration.py"
      - "motion-v2/script-flow-explain-en.txt"
      - "motion-v2/src/AgentPermissionFlowExplain.tsx"
      - "motion-v2/src/Root.tsx"
      - "motion-v2/src/flowExplainTiming.json"
      - ".github/workflows/flowminute-flow-explain-av-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-flow-explain-av-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render_review_only:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CI: "true"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free, bounded render + open-weight speech dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check --no-input 'kokoro-onnx==0.6.1' numpy soundfile
          cd motion-v2
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Fetch public licensed Kokoro voice data into temporary runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kokoro" "$RUNNER_TEMP/flow-explain"
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --retry 2 --max-time 220 "$base/kokoro-v1.0.onnx" -o "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx"
          curl --fail --location --retry 2 --max-time 220 "$base/voices-v1.0.bin" -o "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx")" -gt 1000000
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/voices-v1.0.bin")" -gt 100000
      - name: Generate English speech and exact phrase SRT in one timeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_flow_explain_timed_narration.py \
            --model-dir "$RUNNER_TEMP/kokoro" \
            --script motion-v2/script-flow-explain-en.txt \
            --public-dir motion-v2/public \
            --timing-file motion-v2/src/flowExplainTiming.json \
            --output-dir "$RUNNER_TEMP/flow-explain"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("motion-v2/src/flowExplainTiming.json").read_text())
          assert len(d["cues"])==13 and len(d["beat_starts"])==6
          assert all(d["cues"][i]["end_frame"]<=d["cues"][i+1]["start_frame"] for i in range(12))
          assert all(d["beat_starts"][i]<d["beat_starts"][i+1] for i in range(5))
          assert 720<=d["duration_frames"]<=1650
          print("SYNTHETIC_VOICE_PHRASE_TIMING_GATES_PASSED",d["duration_frames"])
          PY
      - name: Full original Remotion film with real generated synthetic voice
        shell: bash
        working-directory: motion-v2
        run: |
          set -euo pipefail
          npx remotion render src/index.ts AgentPermissionFlowExplain \
            "$RUNNER_TEMP/flow-explain/FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_EN_REVIEW_ONLY.mp4" \
            --props='{"includeNarration":true}' \
            --concurrency=1 --codec=h264 --crf=24 --pixel-format=yuv420p --log=error
      - name: Verify full decode, real sound, exact dimensions and finite duration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out=Path(os.environ["RUNNER_TEMP"])/"flow-explain"
          vid=out/"FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_EN_REVIEW_ONLY.mp4"
          d=json.loads(Path("motion-v2/src/flowExplainTiming.json").read_text())
          assert vid.is_file() and vid.stat().st_size>1000000
          p=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-xerror","-i",str(vid),"-f","null","-"],capture_output=True,text=True,timeout=180)
          assert p.returncode==0,p.stderr[-1400:]
          p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,codec_name,width,height,nb_frames,sample_rate","-of","json",str(vid)],capture_output=True,text=True,check=True)
          info=json.loads(p.stdout)
          streams=info["streams"]
          video=next(s for s in streams if s["codec_type"]=="video")
          audio=next(s for s in streams if s["codec_type"]=="audio")
          assert video["width"]==1080 and video["height"]==1920
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert abs(float(info["format"]["duration"])-d["duration_frames"]/30)<0.2
          assert int(video["nb_frames"])==d["duration_frames"],(video["nb_frames"],d["duration_frames"])
          qa=json.loads((out/"flow-explain-voice-timing-qa.json").read_text())
          assert qa["human_listening_approved"] is False
          assert qa["youtube_published"] is False
          (out/"remotion-media-verification.json").write_text(json.dumps({"status":"REVIEW_ONLY_NOT_PUBLISHED","dimensions":[1080,1920],"frames":int(video["nb_frames"]),"duration_seconds":float(info["format"]["duration"]),"codecs":["h264","aac"],"all_samples_decoded":True,"human_review_passed":False,"youtube_published":False},indent=2)+"\n")
          print("FULL_REAL_REMOTION_AUDIO_VISUAL_DECODE_PASSED")
          PY
      - name: Capture six actual finished film frames
        shell: bash
        working-directory: motion-v2
        run: |
          set -euo pipefail
          frames="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("src/flowExplainTiming.json").read_text())
          marks=d["beat_starts"]+[d["duration_frames"]]
          print(" ".join(str(min(d["duration_frames"]-1,(marks[i]+marks[i+1])//2)) for i in range(6)))
          PY
          )"
          for frame in $frames; do
            npx remotion still src/index.ts AgentPermissionFlowExplain \
              "$RUNNER_TEMP/flow-explain/real-frame-${frame}.png" \
              --frame="$frame" --props='{"includeNarration":true}' --log=error
          done
          test "$(find "$RUNNER_TEMP/flow-explain" -name 'real-frame-*.png' | wc -l)" -eq 6
      - name: Keep review artifact briefly, never upload to YouTube
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-flow-explain-full-av-review-only
          path: |
            ${{ runner.temp }}/flow-explain/FLOWMINUTE_AI_AGENT_FLOW_EXPLAIN_EN_REVIEW_ONLY.mp4
            ${{ runner.temp }}/flow-explain/flow-explain-english-phrase-captions.srt
            ${{ runner.temp }}/flow-explain/flow-explain-voice-timing-qa.json
            ${{ runner.temp }}/flow-explain/remotion-media-verification.json
            ${{ runner.temp }}/flow-explain/real-frame-*.png
          retention-days: 1
          if-no-files-found: error
