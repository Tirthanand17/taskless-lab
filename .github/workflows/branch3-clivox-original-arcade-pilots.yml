name: Branch 3 Clivox Original Arcade 2 Shorts + Long REVIEW Renders

on:
  # Any accepted change to this first-party creative source/renderer on main
  # creates a fresh full-resolution 3-episode REVIEW artifact. This workflow
  # has no YouTube OAuth, no source downloads and no publishing permission.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch3-clivox-original-arcade-pilots.yml'
      - 'scripts/branch3_original_arcade_pilots.py'
      - 'scripts/branch3_original_arcade_qa.py'
      - 'scripts/branch3_a6_original_handoff.py'
      - 'scripts/branch3_a6_original_review_signature.py'
      - 'branch3/original_pilots/arcade_trio.json'
  pull_request:
    paths:
      - 'scripts/branch3_original_arcade_pilots.py'
      - 'scripts/branch3_original_arcade_qa.py'
      - 'scripts/test_branch3_original_arcade_pilots.py'
      - 'scripts/branch3_a6_original_handoff.py'
      - 'scripts/test_branch3_a6_original_handoff.py'
      - 'scripts/branch3_a6_original_review_signature.py'
      - 'scripts/test_branch3_a6_original_review_signature.py'
      - 'branch3/original_pilots/**'
      - 'branch3/architecture/**'
      - '.github/workflows/branch3-clivox-original-arcade-pilots.yml'
  workflow_dispatch:
    inputs:
      selection:
        description: 'One short for speed, or both Shorts and the long episode'
        required: true
        default: all
        type: choice
        options:
          - all
          - one
      render_mode:
        description: 'Preview or full-resolution original-only REVIEW copies'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - full

permissions:
  contents: read

concurrency:
  group: clivox-original-arcade-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original_arcade_source_free_render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_CREATOR_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_AUTHOR_SIGNED_RELEASE_ENABLED: 'false'
      SELECTED_MODE: ${{ github.event_name == 'push' && 'full' || inputs.render_mode || 'preview' }}
      SELECTED_EPISODES: ${{ github.event_name == 'push' && 'all' || inputs.selection || 'one' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open original illustration, speech synth and AV tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --disable-pip-version-check Pillow==11.3.0 'cryptography>=44,<47'
          command -v ffprobe
          command -v ffmpeg
          command -v espeak-ng
      - name: Independent original-rights, scene, caption and technical-QA tests
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_original_arcade_pilots.py scripts/branch3_original_arcade_qa.py scripts/test_branch3_original_arcade_pilots.py scripts/branch3_a6_original_handoff.py scripts/test_branch3_a6_original_handoff.py scripts/branch3_a6_original_review_signature.py scripts/test_branch3_a6_original_review_signature.py
          python -B -m unittest -v scripts.test_branch3_original_arcade_pilots scripts.test_branch3_a6_original_handoff scripts.test_branch3_a6_original_review_signature scripts.test_branch3_a5_media scripts.test_branch3_a4_editorial
      - name: Render original-first arcade video(s) in disposable GitHub temp only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clivox-original"
          python -B -m scripts.branch3_original_arcade_pilots --mode "$SELECTED_MODE" --selection "$SELECTED_EPISODES" --output "$RUNNER_TEMP/clivox-original"
      - name: Independently check actual H264 AAC and source-free SHA provenance
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_original_arcade_qa --selection "$SELECTED_EPISODES" --directory "$RUNNER_TEMP/clivox-original"
          python -B -c 'import pathlib,json,os; d=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-original"; manifests=list(d.glob("*/review-manifest.json")); assert len(manifests)==(3 if os.environ["SELECTED_EPISODES"]=="all" else 1); assert all(json.loads(p.read_text())["ready_to_publish"] is False for p in manifests); reports=list(d.glob("*/technical-review-qa.json")); assert len(reports)==len(manifests) and all(json.loads(p.read_text())["actual_ffprobe_checks_passed"] and not json.loads(p.read_text())["youtube_upload_authorized"] for p in reports); print("CLIVOX_ORIGINAL_FIRST_PARTY_MEDIA_QA_PASS_UPLOAD_LOCKED")'
      - name: Bind exact original video audio SRT metadata and fresh QA into A6 quarantined owner handoff
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a6_original_handoff --mode build --selection "$SELECTED_EPISODES" --directory "$RUNNER_TEMP/clivox-original" > "$RUNNER_TEMP/clivox-original-owner-handoff-result.json"
          python -B -c 'import json,os,pathlib; d=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-original"; m=list(d.glob("*/owner-handoff-quarantined.json")); assert len(m)==(3 if os.environ["SELECTED_EPISODES"]=="all" else 1); assert all(not json.loads(p.read_text())["owner_detached_signature_present"] and not json.loads(p.read_text())["youtube_upload_authorized"] and not json.loads(p.read_text())["youtube_publish_authorized"] for p in m); print("CLIVOX_A6_REAL_VIDEO_DIGEST_HANDOFF_NO_OWNER_APPROVAL_NO_YOUTUBE")'
      - name: Reinspect exact videos and generate unsigned owner editorial review checklists
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a6_original_review_signature --mode unsigned --selection "$SELECTED_EPISODES" --directory "$RUNNER_TEMP/clivox-original" > "$RUNNER_TEMP/clivox-owner-editorial-unsigned-result.json"
          python -B -c 'import json,os,pathlib; d=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-original"; forms=list(d.glob("*/owner-editorial-review-UNSIGNED.json")); assert len(forms)==(3 if os.environ["SELECTED_EPISODES"]=="all" else 1); assert all(all(v is False for v in json.loads(p.read_text())["owner_review_checks"].values()) and json.loads(p.read_text())["owner_review_completed_at_utc"] is None and json.loads(p.read_text())["action"]=="EDITORIAL_REVIEW_CLAIM_ONLY_NO_UPLOAD" for p in forms); print("CLIVOX_A6_ALL_UNSIGNED_REVIEW_CHECKLISTS_BOUND_TO_ACTUAL_MEDIA_NO_OWNER_SIGNING")'
      - name: Reverify exact rendered full review package and unsigned owner forms, with no mutation
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a6_original_review_signature --mode verify --selection "$SELECTED_EPISODES" --directory "$RUNNER_TEMP/clivox-original" > "$RUNNER_TEMP/clivox-original-owner-review-verified.json"
          python -B -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-original-owner-review-verified.json").read_text()); assert d["episode_count"]==(3 if os.environ["SELECTED_EPISODES"]=="all" else 1) and d["all_episode_video_audio_caption_metadata_and_qa_hashes_recomputed"] and d["unsigned_checklist_files_matched_exact_media"] and d["actual_owner_signature_keys_loaded"]==0 and d["actual_human_video_approvals_verified"]==0 and not d["youtube_upload_authorized"] and not d["youtube_schedule_authorized"] and not d["youtube_publish_authorized"]; print("CLIVOX_A6_EXACT_REVIEW_PACK_VERIFIED_NO_OWNER_APPROVAL_OR_YOUTUBE")'
      - name: Assert main push builds all 3 FULL resolution reviewer masters, never publication
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF" = "refs/heads/main"
            test "$SELECTED_EPISODES" = "all"
            test "$SELECTED_MODE" = "full"
          fi
          test "$PUBLISH_ENABLED" = "false"
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = "false"
      - name: Upload only author-owned new graphics/fiction/TTS reviewer files (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: clivox-original-arcade-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/clivox-original/**/original-review-preview.mp4
            ${{ runner.temp }}/clivox-original/**/narration-timing-draft.srt
            ${{ runner.temp }}/clivox-original/**/scene-*.png
            ${{ runner.temp }}/clivox-original/**/original-tts-and-procedural-ambience.wav
            ${{ runner.temp }}/clivox-original/**/metadata-preview.json
            ${{ runner.temp }}/clivox-original/**/owner-handoff-quarantined.json
            ${{ runner.temp }}/clivox-original/**/owner-editorial-review-UNSIGNED.json
            ${{ runner.temp }}/clivox-original/**/review-manifest.json
            ${{ runner.temp }}/clivox-original/**/technical-review-qa.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm no creator media, owner release, Google, or upload access
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_CREATOR_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_AUTHOR_SIGNED_RELEASE_ENABLED" = 'false'
          echo 'Review videos are original fictional mini-games, NOT human approved production releases.'
