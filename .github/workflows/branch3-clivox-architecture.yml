name: Branch 3 Clivox Architecture Contracts (NO MEDIA / NO YOUTUBE)

on:
  pull_request:
    paths:
      - "branch3/architecture/**"
      - "branch3/contracts/**"
      - "scripts/branch3_architecture_gate.py"
      - "scripts/test_branch3_architecture_gate.py"
      - "scripts/branch3_discovery.py"
      - "scripts/test_branch3_discovery.py"
      - "scripts/branch3_rights_case_intake.py"
      - "scripts/test_branch3_rights_case_intake.py"
      - ".github/workflows/branch3-clivox-a1-discovery.yml"
      - ".github/workflows/branch3-clivox-architecture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_design_only_contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      CLIVOX_AUTO_DOWNLOAD_ENABLED: "0"
      CLIVOX_AUTO_UPLOAD_ENABLED: "0"
      CLIVOX_ARCHITECTURE_STATE: "DESIGN_ONLY"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate architecture contracts and no-release policy
        run: |
          python -B -m py_compile scripts/branch3_architecture_gate.py scripts/test_branch3_architecture_gate.py
          python -B scripts/branch3_architecture_gate.py
          python -B -m unittest -v scripts.test_branch3_architecture_gate scripts.test_branch3_discovery scripts.test_branch3_rights_case_intake
          python -B scripts/branch3_discovery.py --mode fixture --category gaming --out "$RUNNER_TEMP/clivox-a1-offline-fixture.json"
          python -B -c 'import json,os,pathlib; r=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a1-offline-fixture.json").read_text()); assert r["is_synthetic_fixture"] is True and r["release_or_media_acquisition_allowed"] is False and all(c["permission_state"]=="UNVERIFIED" for c in r["candidates"]); print("A1_SYNTHETIC_OFFLINE_PASS")'
          python -B scripts/branch3_rights_case_intake.py --source-report "$RUNNER_TEMP/clivox-a1-offline-fixture.json" --out "$RUNNER_TEMP/clivox-a2-offline-cases.json"
          python -B -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a2-offline-cases.json"; d=json.loads(p.read_text()); assert d["cases_all_unverified"] is True and d["creator_permission_grants_issued_by_this_workflow"]==0 and d["media_downloads"]==0 and d["youtube_writes"]==0; print("A2_REVIEW_CASES_PENDING_ONLY")'
          python -B scripts/branch3_validate_prelaunch.py
      - name: Assert no production permission source or uploader has been configured
        run: |
          test "$PUBLISH_ENABLED" = "false"
          test "$CLIVOX_AUTO_DOWNLOAD_ENABLED" = "0"
          test "$CLIVOX_AUTO_UPLOAD_ENABLED" = "0"
          echo "Clivox architecture QA only; no YouTube network request or media acquisition."
