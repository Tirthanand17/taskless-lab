name: Content Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest 'cryptography>=44,<47' 'pillow>=11,<13'
      - name: Install FFmpeg for actual media inspection tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run tests
        run: python -m pytest -q
      - name: Validate episode editorial metadata (not publish approval)
        shell: bash
        run: |
          shopt -s nullglob
          for f in content/episodes/*.json; do
            python scripts/validate_release.py "$f" --editorial-only
          done
