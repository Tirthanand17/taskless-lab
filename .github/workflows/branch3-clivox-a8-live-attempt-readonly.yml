name: Clivox A8 Owner-Reviewed Private Upload Attempt Ledger READ-ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a8-owner-private-attempt-readonly
  cancel-in-progress: false

jobs:
  owner_approved_private_attempt_integrity_snapshot:
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'Tirthanand17' && github.triggering_actor == 'Tirthanand17' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: clivox-vault-readonly
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_GITHUB_CONTENTS_WRITE_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_UPLOAD_RETRY_ENABLED: 'false'
      CLIVOX_A8_APPROVED_PRIVATE_VAULT_NAME: ${{ secrets.CLIVOX_A8_APPROVED_PRIVATE_VAULT_NAME }}
      CLIVOX_A8_PRIVATE_CONTENTS_READ_TOKEN: ${{ secrets.CLIVOX_A8_PRIVATE_CONTENTS_READ_TOKEN }}
      CLIVOX_A8_ATTEMPT_LEDGER_READ_APPROVED: ${{ secrets.CLIVOX_A8_ATTEMPT_LEDGER_READ_APPROVED }}
      CLIVOX_A8_OWNER_PINNED_ATTEMPT_SEQ: ${{ secrets.CLIVOX_A8_OWNER_PINNED_ATTEMPT_SEQ }}
      CLIVOX_A8_OWNER_PINNED_ATTEMPT_SHA256: ${{ secrets.CLIVOX_A8_OWNER_PINNED_ATTEMPT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Owner main manual and upload denial preflight
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Tirthanand17/taskless-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_ACTOR" = 'Tirthanand17'
          test "$GITHUB_TRIGGERING_ACTOR" = 'Tirthanand17'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_GITHUB_CONTENTS_WRITE_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_UPLOAD_RETRY_ENABLED" = 'false'
      - name: Three fixed GitHub GETs — private repo, collaborators and exact upload attempt journal
        run: |
          python -B -m scripts.branch3_a8_live_attempt_readonly --mode live
      # This workflow neither writes A8 reservations nor clears ambiguous
      # attempts. It never processes creator source, Google OAuth or YouTube.
      # No private repository URL, token, ledger body or artifact is emitted.
