name: Clivox A8 Owner-Reviewed COMPLETE BOUNDED Uploads READ-ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a8-full-bounded-owner-inventory
  cancel-in-progress: false

jobs:
  clivox_owner_manual_readonly_inventory:
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'Tirthanand17' && github.triggering_actor == 'Tirthanand17' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: clivox-readonly
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_REMOTE_INVENTORY_MAY_AUTHORIZE_RETRY: 'false'
      CLIVOX_A8_INVENTORY_READ_APPROVED: ${{ secrets.CLIVOX_A8_INVENTORY_READ_APPROVED }}
      CLIVOX_A7_READONLY_CLIENT_ID: ${{ secrets.CLIVOX_A7_READONLY_CLIENT_ID }}
      CLIVOX_A7_READONLY_CLIENT_SECRET: ${{ secrets.CLIVOX_A7_READONLY_CLIENT_SECRET }}
      CLIVOX_A7_READONLY_REFRESH_TOKEN: ${{ secrets.CLIVOX_A7_READONLY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact owner/main/manual trigger and no external rights or writes
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Tirthanand17/taskless-lab'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_ACTOR" = 'Tirthanand17'
          test "$GITHUB_TRIGGERING_ACTOR" = 'Tirthanand17'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_REMOTE_INVENTORY_MAY_AUTHORIZE_RETRY" = 'false'
      - name: Strict authenticated Clivox-only uploads playlist enumeration and video status
        run: |
          python -B -m scripts.branch3_a8_exhaustive_inventory --mode live
      # Owner approval must be configured in the protected environment;
      # no artifacts, private video IDs, tokens, credentials or upload/write calls.
