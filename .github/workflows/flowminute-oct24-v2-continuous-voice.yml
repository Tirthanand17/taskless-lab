name: FlowMinute Cinematic V2 Continuous Speech Review (No Publish)

on:
  push:
    branches:
      - "feature/oct24-multicharacter-3d-lesson-contract"
    paths:
      - "scripts/produce_oct24_english_v2_continuous_voice.py"
      - ".github/workflows/flowminute-oct24-v2-continuous-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fm-oct24-v2-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render_continuous_24_second_speech:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline free speech generation and verification
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check --no-input \
            'kokoro-onnx==0.6.1' numpy soundfile

      - name: Download only public licensed Kokoro weights into ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kokoro" "$RUNNER_TEMP/output"
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --retry 2 --max-time 220 \
            "$base/kokoro-v1.0.onnx" -o "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx"
          curl --fail --location --retry 2 --max-time 220 \
            "$base/voices-v1.0.bin" -o "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx")" -gt 1000000
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/voices-v1.0.bin")" -gt 100000

      - name: Generate one continuous 24-second voice stem with no dead gaps
        shell: bash
        run: |
          set -euo pipefail
          python scripts/produce_oct24_english_v2_continuous_voice.py \
            --model-dir "$RUNNER_TEMP/kokoro" \
            --out "$RUNNER_TEMP/output/FlowMinute_Oct24_V2_24s_CONTINUOUS_VOICE_REVIEW_ONLY.wav"

      - name: Verify voice file and reject 3s dead-air repeats
        shell: bash
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/output/FlowMinute_Oct24_V2_24s_CONTINUOUS_VOICE_REVIEW_ONLY.wav"
          test -s "$f"
          ffmpeg -hide_banner -loglevel error -xerror -i "$f" -f null -
          ffprobe -v error -show_entries stream=sample_rate,duration \
            -of default=noprint_wrappers=1 "$f"
          python - "$f" <<'PY'
          import json,sys
          from pathlib import Path
          f=Path(sys.argv[1])
          r=json.loads(f.with_suffix(".qa.json").read_text())
          assert r["speech_only_gap_audit"]["pass"] is True
          assert r["audio_duration_seconds"]==24
          assert r["three_3d_clips_created"] is False
          assert r["youtube_scheduled"] is False
          print(json.dumps({"sha256":r["file_sha256"],
               "spoken_words":r["spoken_words"],
               "pacing_audit":r["speech_only_gap_audit"],
               "youtube_scheduled":False},indent=2))
          PY

      - name: Retain only spoken WAV and factual QA for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-oct24-v2-continuous-24s-voice-review
          path: |
            ${{ runner.temp }}/output/FlowMinute_Oct24_V2_24s_CONTINUOUS_VOICE_REVIEW_ONLY.wav
            ${{ runner.temp }}/output/FlowMinute_Oct24_V2_24s_CONTINUOUS_VOICE_REVIEW_ONLY.qa.json
          retention-days: 1
          if-no-files-found: error
