name: Collect YouTube Metrics

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Published YouTube video ID"
        required: true
        type: string
      episode_id:
        description: "Repository episode ID"
        required: true
        default: "pilot_001"
        type: string
      days:
        description: "Analytics window"
        required: true
        default: "7"
        type: choice
        options: ["1","3","7","28"]

permissions:
  contents: write

jobs:
  metrics:
    if: ${{ vars.ANALYTICS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install google-api-python-client google-auth
      - name: Collect metrics
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python scripts/collect_youtube_metrics.py \
            --video-id "${{ inputs.video_id }}" \
            --episode-id "${{ inputs.episode_id }}" \
            --days "${{ inputs.days }}"
      - name: Commit analytics snapshot
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics
          git diff --cached --quiet && exit 0
          git commit -m "Record YouTube analytics snapshot"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
