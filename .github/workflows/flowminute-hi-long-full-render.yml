name: FLOWMINUTE Hindi Agent Permissions Long Video Render (no publish)

on:
  push:
    branches:
      - "feature/oct24-multicharacter-3d-lesson-contract"
    paths:
      - "content/flow/agent_permissions_long_hi_narration.json"
      - "scripts/generate_flow_explain_long_hindi_voice.py"
      - "motion-v2/src/AgentPermissionLongHi.tsx"
      - "motion-v2/src/flowExplainLongHiTiming.json"
      - "motion-v2/src/Root.tsx"
      - ".github/workflows/flowminute-hi-long-full-render.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-hi-long-full-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_original_hindi_long_review:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      CI: "true"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local free rendering and voice dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check --no-input 'kokoro-onnx==0.6.1' numpy soundfile
          cd motion-v2
          npm install --no-audit --no-fund
          npx remotion browser ensure
      - name: Download only publicly licensed Kokoro model into ephemeral folder
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flowminute-long/kokoro" "$RUNNER_TEMP/flowminute-long/output"
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --retry 2 --max-time 220 "$base/kokoro-v1.0.onnx" -o "$RUNNER_TEMP/flowminute-long/kokoro/kokoro-v1.0.onnx"
          curl --fail --location --retry 2 --max-time 220 "$base/voices-v1.0.bin" -o "$RUNNER_TEMP/flowminute-long/kokoro/voices-v1.0.bin"
          test "$(stat -c%s "$RUNNER_TEMP/flowminute-long/kokoro/kokoro-v1.0.onnx")" -gt 1000000
          test "$(stat -c%s "$RUNNER_TEMP/flowminute-long/kokoro/voices-v1.0.bin")" -gt 100000
      - name: Generate original 6-chapter Hindi speech, caption SRT and per-chapter timings
        run: |
          set -euo pipefail
          python scripts/generate_flow_explain_long_hindi_voice.py \
            --model-dir "$RUNNER_TEMP/flowminute-long/kokoro" \
            --source content/flow/agent_permissions_long_hi_narration.json \
            --public-dir motion-v2/public \
            --timing-file motion-v2/src/flowExplainLongHiTiming.json \
            --output-dir "$RUNNER_TEMP/flowminute-long/output"
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path("motion-v2/src/flowExplainLongHiTiming.json").read_text(encoding="utf-8"))
          assert len(d["chapter_starts"])==6
          assert len(d["cues"])==29
          assert all(d["chapter_starts"][i]<d["chapter_starts"][i+1] for i in range(5))
          assert 3000<d["duration_frames"]<9000
          print("HINDI_LONG_PHRASE_TIMING_QA_PASSED",d["duration_frames"])
          PY
      - name: Full 1080p 16:9 original Hindi long film with narration
        working-directory: motion-v2
        run: |
          set -euo pipefail
          npx remotion render src/index.ts AgentPermissionLongHi \
            "$RUNNER_TEMP/flowminute-long/output/FLOWMINUTE_AI_AGENT_HINDI_LONG_REVIEW_ONLY.mp4" \
            --props='{"includeNarration":true}' \
            --concurrency=2 --codec=h264 --crf=26 --pixel-format=yuv420p --log=error
      - name: Validate entire H264 AAC film and exact dynamic frame count
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess,hashlib
          from pathlib import Path
          d=json.loads(Path("motion-v2/src/flowExplainLongHiTiming.json").read_text())
          out=Path(os.environ["RUNNER_TEMP"])/"flowminute-long/output"
          file=out/"FLOWMINUTE_AI_AGENT_HINDI_LONG_REVIEW_ONLY.mp4"
          assert file.is_file() and file.stat().st_size>1_000_000
          dec=subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-xerror","-i",str(file),"-f","null","-"],capture_output=True,text=True,timeout=420)
          assert dec.returncode==0,dec.stderr[-900:]
          p=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration:stream=codec_type,codec_name,width,height,nb_frames","-of","json",str(file)],capture_output=True,text=True,check=True)
          info=json.loads(p.stdout)
          video=next(x for x in info["streams"] if x["codec_type"]=="video")
          audio=next(x for x in info["streams"] if x["codec_type"]=="audio")
          assert (video["width"],video["height"])==(1920,1080)
          assert video["codec_name"]=="h264" and audio["codec_name"]=="aac"
          assert int(video["nb_frames"])==d["duration_frames"]
          assert abs(float(info["format"]["duration"])-d["duration_frames"]/24)<0.2
          receipt={"status":"MEDIA_TECHNICAL_QA_PASSED_NOT_HUMAN_APPROVED",
                   "sha256":hashlib.sha256(file.read_bytes()).hexdigest(),
                   "duration":float(info["format"]["duration"]),
                   "frames":int(video["nb_frames"]),"size":[1920,1080],"codecs":["h264","aac"],
                   "voice_human_approved":False,"rights_approved":False,
                   "final_video_approved":False,"youtube_published":False}
          (out/"long_media_qa.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print("FULL_ORIGINAL_HINDI_LONG_DECODE_PASSED")
          PY
      - name: Render six chapter inspection frames
        working-directory: motion-v2
        run: |
          set -euo pipefail
          frames="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("src/flowExplainLongHiTiming.json").read_text())
          s=d["chapter_starts"]+[d["duration_frames"]]
          print(" ".join(str((s[i]+s[i+1])//2) for i in range(6)))
          PY
          )"
          for frame in $frames; do
            npx remotion still src/index.ts AgentPermissionLongHi \
              "$RUNNER_TEMP/flowminute-long/output/real-long-frame-${frame}.png" \
              --frame="$frame" --props='{"includeNarration":true}' --log=error
          done
          test "$(find "$RUNNER_TEMP/flowminute-long/output" -name 'real-long-frame-*.png' | wc -l)" -eq 6
      - name: Retain only internal video/SRT/QA review for 1 day
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-hi-agent-permission-long-full-review-only
          path: |
            ${{ runner.temp }}/flowminute-long/output/FLOWMINUTE_AI_AGENT_HINDI_LONG_REVIEW_ONLY.mp4
            ${{ runner.temp }}/flowminute-long/output/hindi-long-captions.srt
            ${{ runner.temp }}/flowminute-long/output/hindi-long-speech-qa.json
            ${{ runner.temp }}/flowminute-long/output/long_media_qa.json
            ${{ runner.temp }}/flowminute-long/output/real-long-frame-*.png
          retention-days: 1
          if-no-files-found: error
