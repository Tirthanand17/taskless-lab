name: FlowMinute Cloud Scout (public, no secrets)
on:
  schedule:
    # 18:45 India time, 13:15 UTC. Research only; not rendering or publishing.
    - cron: "15 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/flowminute-cloud-scout.yml"
permissions:
  contents: read
concurrency:
  group: flowminute-public-scout
  cancel-in-progress: false
jobs:
  research_scout:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests and security boundaries
        run: python -m unittest discover -s autopilot -p 'test_*.py' -v
      - name: Gather public unverified research leads
        if: github.event_name != 'pull_request'
        run: python -m autopilot.scout --output out/scout-report.json
      - name: Store public research leads (no secrets)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-public-scout
          path: out/scout-report.json
          retention-days: 5
          if-no-files-found: error
