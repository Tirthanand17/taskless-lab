name: FlowMinute Cloud Scout (public, no secrets)
on:
  schedule:
    # 18:45 India time, 13:15 UTC. Research only; not rendering or publishing.
    - cron: "15 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "autopilot/**"
      - ".github/workflows/flowminute-cloud-scout.yml"
permissions:
  contents: read
concurrency:
  # A stalled older scout must not block new pull-request checks. Cancel
  # stale checks for the SAME PR; keep independent daily scheduled runs.
  group: flowminute-public-scout-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  research_scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only signed public-source review dependency (no apt/FFmpeg)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography>=46,<48'
      - name: Verify RSS/source/claim/approval boundaries without invoking video tools
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python -B -m unittest -v \
            autopilot.test_agent_org \
            autopilot.test_daily_cloud_plan \
            autopilot.test_evidence_probe \
            autopilot.test_source_fetch_diagnostics_b4d3 \
            autopilot.test_arxiv_primary_feed_b4d4 \
            autopilot.test_b4d4b_public_scout_ci_boundary \
            autopilot.test_daily_editorial_board \
            autopilot.test_daily_evidence_bundle \
            autopilot.test_script_draft_agent \
            autopilot.test_source_claim_preflight \
            autopilot.test_independent_fact_review_gate
          echo "B4D4B_PUBLIC_RESEARCH_SECURITY_TESTS_NO_VIDEO_DOWNLOAD"
      - name: Gather public unverified research leads
        if: github.event_name != 'pull_request'
        run: python -m autopilot.scout --output out/scout-report.json
      - name: Print bounded publisher counts only (no article titles or URLs)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections,json,os
          from pathlib import Path
          from autopilot.scout import FEEDS
          report=json.loads(Path("out/scout-report.json").read_text(encoding="utf-8"))
          allowed={name for name,_ in FEEDS}
          counts=collections.Counter(x["publisher"] for x in report["leads"])
          assert set(counts).issubset(allowed)
          assert len(report["leads"])<=24
          assert all(0<=n<=6 for n in counts.values())
          assert report["status"]=="leads_only_no_publish_authorization"
          lines=["## FlowMinute public research scout (UNVERIFIED)",
                 "","Publisher counts only; no headlines, article URLs or content retained.",
                 "","| Publisher | Unverified leads |","|---|---:|"]
          for pub,n in sorted(counts.items()):
              lines.append("| "+pub+" | "+str(n)+" |")
          lines+=["","No claim review, model generation, media or YouTube publish.",
                  "Raw scout response is transient on GitHub's hosted runner."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as output:
              output.write("\n".join(lines)+"\n")
          print("B4D4B_SCOUT_COUNTS_ONLY_NO_EXTERNAL_HEADLINES_OR_URLS",
                json.dumps(dict(counts),sort_keys=True))
          PY

      - name: Discard ephemeral feed headlines, URLs and topic metadata
        if: always()
        run: rm -f out/scout-report.json
