name: CLIVOX V2 P5-P11 Source-Free Rights, Analytics and Scale Readiness QA

on:
  pull_request:
    paths:
      - 'scripts/branch3_v2_p5_synthetic_moment_proposals.py'
      - 'scripts/test_branch3_v2_p5_synthetic_moment_proposals.py'
      - 'scripts/branch3_v2_p5_synthetic_editorial_evaluation.py'
      - 'scripts/test_branch3_v2_p5_synthetic_editorial_evaluation.py'
      - 'scripts/branch3_v2_p5_longform_local_signal_planner.py'
      - 'scripts/test_branch3_v2_p5_longform_local_signal_planner.py'
      - 'scripts/branch3_v2_p6_longform_editorial_intake.py'
      - 'scripts/test_branch3_v2_p6_longform_editorial_intake.py'
      - 'scripts/branch3_v2_p6_synthetic_storyboard.py'
      - 'scripts/test_branch3_v2_p6_synthetic_storyboard.py'
      - 'scripts/branch3_v2_p7_synthetic_vertical_renderer.py'
      - 'scripts/test_branch3_v2_p7_synthetic_vertical_renderer.py'
      - 'scripts/branch3_v2_p8_synthetic_unsigned_review.py'
      - 'scripts/test_branch3_v2_p8_synthetic_unsigned_review.py'
      - 'scripts/branch3_v2_p9_private_first_preflight.py'
      - 'scripts/test_branch3_v2_p9_private_first_preflight.py'
      - 'scripts/branch3_v2_p10_synthetic_analytics_gates.py'
      - 'scripts/test_branch3_v2_p10_synthetic_analytics_gates.py'
      - 'scripts/branch3_v2_p11_synthetic_scale_readiness.py'
      - 'scripts/test_branch3_v2_p11_synthetic_scale_readiness.py'
      - 'branch3/clipping_v2/p11-synthetic-weekly-capacity.json'
      - 'branch3/clipping_v2/P11_*'
      - 'branch3/clipping_v2/P10_*'
      - 'scripts/branch3_a10_analytics.py'
      - 'scripts/branch3_a10_owner_readonly.py'
      - 'branch3/a10/analytics-policy.json'
      - 'branch3/clipping_v2/P9_*'
      - 'scripts/branch3_a8_private_first_dryrun.py'
      - 'branch3/a8/private-cas-policy.json'
      - 'scripts/branch3_a7_readonly_youtube.py'
      - 'branch3/clipping_v2/P8_*'
      - 'scripts/branch3_a6_signed_release.py'
      - 'branch3/release/release-policy.json'
      - 'branch3/clipping_v2/P7_*'
      - 'branch3/clipping_v2/P6_*'
      - '.github/workflows/branch3-clivox-v2-p5-synthetic-candidates-qa.yml'
      - 'branch3/clipping_v2/P5_*'
      - 'branch3/clipping_v2/architecture-status.json'
  push:
    branches: [main]
    paths:
      - 'scripts/branch3_v2_p5_synthetic_moment_proposals.py'
      - 'scripts/test_branch3_v2_p5_synthetic_moment_proposals.py'
      - 'scripts/branch3_v2_p5_synthetic_editorial_evaluation.py'
      - 'scripts/test_branch3_v2_p5_synthetic_editorial_evaluation.py'
      - 'scripts/branch3_v2_p5_longform_local_signal_planner.py'
      - 'scripts/test_branch3_v2_p5_longform_local_signal_planner.py'
      - 'scripts/branch3_v2_p6_longform_editorial_intake.py'
      - 'scripts/test_branch3_v2_p6_longform_editorial_intake.py'
      - 'scripts/branch3_v2_p6_synthetic_storyboard.py'
      - 'scripts/test_branch3_v2_p6_synthetic_storyboard.py'
      - 'scripts/branch3_v2_p7_synthetic_vertical_renderer.py'
      - 'scripts/test_branch3_v2_p7_synthetic_vertical_renderer.py'
      - 'scripts/branch3_v2_p8_synthetic_unsigned_review.py'
      - 'scripts/test_branch3_v2_p8_synthetic_unsigned_review.py'
      - 'scripts/branch3_v2_p9_private_first_preflight.py'
      - 'scripts/test_branch3_v2_p9_private_first_preflight.py'
      - 'scripts/branch3_v2_p10_synthetic_analytics_gates.py'
      - 'scripts/test_branch3_v2_p10_synthetic_analytics_gates.py'
      - 'scripts/branch3_v2_p11_synthetic_scale_readiness.py'
      - 'scripts/test_branch3_v2_p11_synthetic_scale_readiness.py'
      - 'branch3/clipping_v2/p11-synthetic-weekly-capacity.json'
      - 'branch3/clipping_v2/P11_*'
      - 'branch3/clipping_v2/P10_*'
      - 'scripts/branch3_a10_analytics.py'
      - 'scripts/branch3_a10_owner_readonly.py'
      - 'branch3/a10/analytics-policy.json'
      - 'branch3/clipping_v2/P9_*'
      - 'scripts/branch3_a8_private_first_dryrun.py'
      - 'branch3/a8/private-cas-policy.json'
      - 'scripts/branch3_a7_readonly_youtube.py'
      - 'branch3/clipping_v2/P8_*'
      - 'scripts/branch3_a6_signed_release.py'
      - 'branch3/release/release-policy.json'
      - 'branch3/clipping_v2/P7_*'
      - 'branch3/clipping_v2/P6_*'
      - '.github/workflows/branch3-clivox-v2-p5-synthetic-candidates-qa.yml'
      - 'branch3/clipping_v2/P5_*'
      - 'branch3/clipping_v2/architecture-status.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-v2-p5-source-free
  cancel-in-progress: false

jobs:
  synthetic_signals_only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CLIVOX_CREATOR_CONTACT_ENABLED: 'false'
      CLIVOX_SOURCE_DOWNLOAD_ENABLED: 'false'
      CLIVOX_PRIVATE_MEDIA_WRITE_ENABLED: 'false'
      CLIVOX_YOUTUBE_UPLOAD_ENABLED: 'false'
      PUBLISH_ENABLED: 'false'
    steps:
      - name: Read-only controller checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python standard library only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert NO RIGHTS OR UPLOAD and run source-free negative tests
        run: |
          set -euo pipefail
          test "$CLIVOX_CREATOR_CONTACT_ENABLED" = false
          test "$CLIVOX_SOURCE_DOWNLOAD_ENABLED" = false
          test "$CLIVOX_PRIVATE_MEDIA_WRITE_ENABLED" = false
          test "$CLIVOX_YOUTUBE_UPLOAD_ENABLED" = false
          test "$PUBLISH_ENABLED" = false
          python -B -m scripts.branch3_v2_p5_synthetic_moment_proposals --mode closed
          python -B -m scripts.branch3_v2_p5_synthetic_editorial_evaluation --mode closed
          python -B -m scripts.branch3_v2_p5_longform_local_signal_planner --mode closed
          python -B -m scripts.branch3_v2_p5_longform_local_signal_planner --mode synthetic
          python -B -m scripts.branch3_v2_p6_longform_editorial_intake --mode closed
          python -B -m scripts.branch3_v2_p6_longform_editorial_intake --mode synthetic
          python -B -m scripts.branch3_v2_p6_synthetic_storyboard --mode closed
          python -B -m scripts.branch3_v2_p7_synthetic_vertical_renderer --mode closed
          python -B -m scripts.branch3_v2_p8_synthetic_unsigned_review --mode closed
          python -B -m scripts.branch3_v2_p9_private_first_preflight --mode closed
          python -B -m scripts.branch3_v2_p10_synthetic_analytics_gates --mode closed
          python -B -m scripts.branch3_v2_p11_synthetic_scale_readiness --mode closed
          python -B -m unittest -v \
            scripts.test_branch3_v2_p11_synthetic_scale_readiness \
            scripts.test_branch3_v2_p10_synthetic_analytics_gates \
            scripts.test_branch3_v2_p9_private_first_preflight \
            scripts.test_branch3_v2_p8_synthetic_unsigned_review \
            scripts.test_branch3_v2_p7_synthetic_vertical_renderer \
            scripts.test_branch3_v2_p6_synthetic_storyboard \
            scripts.test_branch3_v2_p5_synthetic_editorial_evaluation \
            scripts.test_branch3_v2_p5_longform_local_signal_planner \
            scripts.test_branch3_v2_p6_longform_editorial_intake \
            scripts.test_branch3_v2_p5_synthetic_moment_proposals \
            scripts.test_branch3_v2_p4_synthetic_handoff_preflight
      - name: Install Ubuntu FFmpeg for generated color/sine signal ONLY
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Build original synthetic black/white scene and silence/sine sample in ephemeral runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clivox-p5-synthetic"
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i "color=c=black:s=160x90:r=10:d=2" \
            -f lavfi -i "color=c=white:s=160x90:r=10:d=1" \
            -f lavfi -i "color=c=black:s=160x90:r=10:d=3" \
            -f lavfi -i "anullsrc=r=48000:cl=mono:d=2" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -f lavfi -i "anullsrc=r=48000:cl=mono:d=3" \
            -filter_complex "[0:v][1:v][2:v]concat=n=3:v=1:a=0[v];[3:a][4:a][5:a]concat=n=3:v=0:a=1[a]" \
            -map "[v]" -map "[a]" -t 6 -c:v libx264 -threads:v 1 \
            -pix_fmt yuv420p -c:a aac \
            "$RUNNER_TEMP/clivox-p5-synthetic/self_generated.mp4"
          TEST_SHA=$(sha256sum "$RUNNER_TEMP/clivox-p5-synthetic/self_generated.mp4" | cut -d' ' -f1)
          TEST_BYTES=$(stat -c%s "$RUNNER_TEMP/clivox-p5-synthetic/self_generated.mp4")
          python -B -m scripts.branch3_v2_p5_synthetic_moment_proposals \
            --mode synthetic \
            --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            --fixture-file self_generated.mp4 \
            --sha256 "$TEST_SHA" --bytes "$TEST_BYTES" \
            > "$RUNNER_TEMP/clivox-p5-synthetic/quarantined-signals-only.json"
      - name: Independently verify observation-only output and fail if invented claims
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path = (Path(os.environ["RUNNER_TEMP"]) /
                  "clivox-p5-synthetic/quarantined-signals-only.json")
          report = json.loads(path.read_text("utf-8"))
          assert report["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert report["stage"] == "CLIVOX_V2_P5_SYNTHETIC_SIGNAL_CANDIDATES_ONLY"
          assert report["synthetic_original_fixture_only"] is True
          assert report["actual_creator_source_count"] == 0
          assert report["real_creator_license_count"] == 0
          assert report["third_party_video_downloads"] == 0
          assert report["outreach_messages_sent"] == 0
          assert report["youtube_uploads"] == 0
          assert report["youtube_api_calls"] == 0
          assert report["p5_real_licensed_pipeline_complete"] is False
          assert report["p5_real_editor_label_evaluation_complete"] is False
          assert report["ASR_or_VAD_performed"] is False
          assert report["speech_or_quotes_inferred"] is False
          assert report["youtube_replay_heatmap_inferred"] is False
          assert report["estimated_viral_performance"] is None
          assert report["human_source_context_required"] is True
          assert report["synthetic_technical_candidate_count"] >= 1
          rows=report["synthetic_candidate_windows"]
          assert all(
            0 <= r["start_ms"] < r["end_ms"] <= 6000
            and r["machine_transcript"] is None
            and r["creator_rights_verified"] is False
            and r["ready_for_editorial_use"] is False
            and r["human_context_review_required"] is True
            for r in rows)
          assert any("VIDEO_LUMA_CUT" in r["evidence_kinds"] for r in rows)
          assert any("ACOUSTIC_RMS_RISE" in r["evidence_kinds"] for r in rows)
          print("CLIVOX_V2_P5_REAL_GENERATED_SIGNAL_QA_PASS_NO_CREATOR_MEDIA_NO_VIRAL_PREDICTIONS")
          PY
      - name: Compare measured synthetic candidate against generated golden timecodes (no real labels)
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p5_synthetic_editorial_evaluation \
            --mode synthetic \
            --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            --report-file quarantined-signals-only.json \
            > "$RUNNER_TEMP/clivox-p5-synthetic/synthetic-evaluation-only.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          filename = Path(os.environ["RUNNER_TEMP"]) / "clivox-p5-synthetic/synthetic-evaluation-only.json"
          packet = json.loads(filename.read_text("utf-8"))
          assert packet["stage"] == "CLIVOX_V2_P5_SYNTHETIC_REFERENCE_EVALUATION_ONLY"
          assert packet["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert packet["test_sources"] == 1
          assert packet["actual_human_editor_labels"] == 0
          assert packet["real_creator_sources"] == 0
          assert packet["real_creator_licenses"] == 0
          assert packet["training_performed"] is False
          assert packet["real_world_precision_recall_validated"] is False
          assert packet["viral_performance_prediction"] is None
          assert packet["p5_real_milestone_complete"] is False
          assert packet["media_access_or_youtube_upload_authorized"] is False
          assert packet["aggregate_real_creator_api_statistics_computed"] is False
          reference = packet["synthetic_test_metrics"][0]
          assert reference["reference_events"] == 1
          assert reference["matched_events"] == 1
          assert reference["missed_reference_events"] == 0
          print("CLIVOX_V2_P5_GENERATED_SIGNAL_TO_SYNTHETIC_GOLDEN_QA_PASS_NO_LIVE_ACCURACY_CLAIMS")
          PY
      - name: Create source-free original CLIVOX editorial EDL draft from measured P5 signals
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p6_synthetic_storyboard \
            --mode synthetic \
            --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            --report-file quarantined-signals-only.json \
            > "$RUNNER_TEMP/clivox-p5-synthetic/synthetic-edl-draft-only.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "clivox-p5-synthetic/synthetic-edl-draft-only.json"
          data = json.loads(path.read_text("utf-8"))
          assert data["stage"] == "CLIVOX_V2_P6_SYNTHETIC_ORIGINAL_STORYBOARD_DRAFT"
          assert data["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert data["synthetic_fixture_only"] is True
          assert data["draft_canvas"] == {
              "width": 1080, "height": 1920,
              "rendered": False, "visual_cropping_validated": False}
          assert data["draft_duration_ms"] == 6000
          assert data["source_duration_ms"] == 6000
          assert data["candidate_reference"]["validated_real_editorial_selection"] is False
          assert data["real_creator_source_files"] == 0
          assert data["creator_commercial_reuse_grants"] == 0
          assert data["real_source_dialogue_verified"] is False
          assert data["real_editorial_context_confirmed"] is False
          assert data["human_editor_approved"] is False
          assert data["owner_final_media_approved"] is False
          assert data["licensed_clip_used"] is False
          assert data["video_rendered"] is False
          assert data["audio_rendered"] is False
          assert data["youtube_uploads"] == 0
          assert data["youtube_publish_authorized"] is False
          shots = data["draft_shots"]
          assert len(shots) == 3
          assert [(x["target_start_ms"], x["target_end_ms"]) for x in shots] == [
              (0, 2000), (2000, 3000), (3000, 6000)]
          assert [s["source_visual"] for s in shots] == [
              "SELF_GENERATED_BLACK", "SELF_GENERATED_WHITE_WITH_TONE", "SELF_GENERATED_BLACK"]
          assert all(s["requires_human_review"] and not s["creator_dialogue_used"]
                     and not s["licensed_media_inserted"] and not s["publisher_clearance_verified"]
                     for s in shots)
          assert "A sudden cut still needs context." == shots[2]["original_clivox_overlay"]
          from scripts.branch3_v2_p6_synthetic_storyboard import validate_storyboard
          validate_storyboard(data)
          print("CLIVOX_V2_P6_SYNTHETIC_EDL_HOOK_CUE_PAYOFF_PASS_NO_LICENSE_NO_REAL_VIDEO_NO_UPLOAD")
          PY
      - name: Render actual 270x480 original-only 9:16 MP4 and verify independent audio/video QA
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p7_synthetic_vertical_renderer \
            --mode synthetic --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            --edl-file synthetic-edl-draft-only.json \
            > "$RUNNER_TEMP/clivox-p5-synthetic/synthetic-render-qa-only.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "clivox-p5-synthetic"
          report = json.loads((root / "synthetic-render-qa-only.json").read_text("utf-8"))
          assert report["stage"] == "CLIVOX_V2_P7_ORIGINAL_SYNTHETIC_VERTICAL_RENDER_QA_ONLY"
          assert report["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert report["synthetic_original_lavfi_only"] is True
          assert report["preview_width"] == 270 and report["preview_height"] == 480
          assert report["duration_ms"] == 6000
          assert report["source_creator_media_count"] == 0
          assert report["real_creator_licenses_verified"] == 0
          for field in (
              "original_synthetic_mp4_rendered_in_ephemeral_scratch",
              "synthetic_h264_aac_decode_validated",
              "synthetic_portrait_9_16_validated",
              "synthetic_original_caption_pixels_validated",
              "synthetic_audio_cue_and_scene_sync_validated",
          ):
              assert report[field] is True, field
          for field in (
              "real_1080x1920_output_validated",
              "real_creator_source_processing_allowed",
              "real_editorial_context_verified",
              "owner_exact_final_media_approved",
              "youtube_publish_authorized",
              "p7_real_licensed_compositor_milestone_complete",
          ):
              assert report[field] is False, field
          assert report["youtube_uploads"] == 0
          assert (root / "synthetic_clivox_short.mp4").is_file()
          assert (root / "synthetic_clivox_short.mp4").stat().st_size < 8*1024*1024
          # No path, hash or raw media bytes in the public CI metadata.
          assert str(root) not in json.dumps(report)
          assert "source_url" not in report and "contract" not in report
          print("CLIVOX_V2_P7_SYNTHETIC_9_16_RENDER_AV_SYNC_CAPTIONS_PASS_NO_REAL_CREATOR_SOURCE_NO_RELEASE")
          PY
      - name: Recheck exact generated MP4 and write strictly UNSIGNED owner review into ephemeral scratch
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p8_synthetic_unsigned_review \
            --mode synthetic --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            > "$RUNNER_TEMP/clivox-p5-synthetic/synthetic-p8-review-qa-only.json"
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from scripts.branch3_v2_p8_synthetic_unsigned_review import (
              CHECKS, canonical, validate_unsigned_packet, closed_release_boundary,
          )
          root = Path(os.environ["RUNNER_TEMP"]) / "clivox-p5-synthetic"
          data = json.loads((root / "synthetic-p8-review-qa-only.json").read_text("utf-8"))
          assert data["stage"] == "CLIVOX_V2_P8_SYNTHETIC_EXACT_MEDIA_UNSIGNED_REVIEW_QA"
          assert data["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          for key in (
              "synthetic_exact_video_bytes_hashed",
              "synthetic_exact_p6_edl_and_p7_qa_hash_bound",
              "synthetic_media_redecoded_and_audio_visual_rechecked",
              "unsigned_quarantined_review_packet_created_in_runner",
              "review_checks_default_false",
          ):
              assert data[key] is True, key
          assert data["real_rights_grants"] == 0
          assert data["real_creator_media"] == 0
          assert data["real_trusted_owner_key_enrolled"] is False
          assert data["authentic_owner_review_verified"] is False
          assert data["actual_owner_detached_signature_present"] is False
          assert data["real_rights_revocation_freshness_verified"] is False
          assert data["youtube_uploads"] == 0
          assert data["youtube_publish_authorized"] is False
          assert data["p8_real_owner_release_milestone_complete"] is False

          video = root / "synthetic_clivox_short.mp4"
          edl = json.loads((root / "synthetic-edl-draft-only.json").read_text("utf-8"))
          qa = json.loads((root / "synthetic-render-qa-only.json").read_text("utf-8"))
          packet = json.loads((root / "owner-review-UNSIGNED-synthetic.json").read_text("utf-8"))
          expected_sha = hashlib.sha256(video.read_bytes()).hexdigest()
          validate_unsigned_packet(
              packet, video_sha=expected_sha, video_bytes=video.stat().st_size,
              edl=edl, p7_report=qa)
          assert packet["exact_p6_storyboard_sha256"] == hashlib.sha256(canonical(edl)).hexdigest()
          assert packet["exact_p7_qa_report_sha256"] == hashlib.sha256(canonical(qa)).hexdigest()
          assert packet["review_state"] == "UNSIGNED_QUARANTINED_TEST_ONLY"
          assert set(packet["review_checks"]) == set(CHECKS)
          assert all(v is False for v in packet["review_checks"].values())
          assert packet["detached_signature_base64"] is None
          assert packet["source_rights_evidence_sha256"] is None
          assert packet["publish_at_utc"] is None
          assert packet["owner_public_key_independently_enrolled"] is False
          assert packet["owner_release_signed"] is False
          assert packet["youtube_upload_authorized"] is False
          assert packet["youtube_publish_authorized"] is False
          assert packet["real_rights_freshness_verified"] is False
          closed_release_boundary()
          # No media hashes or contracts in the public runner log.
          assert expected_sha not in json.dumps(data)
          assert str(root) not in json.dumps(data)
          print("CLIVOX_V2_P8_EXACT_SYNTHETIC_MP4_HASH_BOUND_UNSIGNED_REVIEW_QA_PASS_NO_OWNER_RELEASE")
          PY
      - name: Recheck P8 unsigned exact-video request and simulate P9 private-first upload as HOLD ONLY
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_v2_p9_private_first_preflight \
            --mode synthetic --scratch "$RUNNER_TEMP/clivox-p5-synthetic" \
            > "$RUNNER_TEMP/clivox-p5-synthetic/synthetic-p9-private-first-HOLD-only.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.branch3_v2_p9_private_first_preflight import (
              TEMPLATE, PUBLIC_REPORT_FIELDS, validate_inert_template,
              dryrun_decision, validate_review_bridge, production_upload_or_schedule,
              P9Denied,
          )
          root = Path(os.environ["RUNNER_TEMP"]) / "clivox-p5-synthetic"
          path = root / "synthetic-p9-private-first-HOLD-only.json"
          data = json.loads(path.read_text("utf-8"))
          assert set(data) == PUBLIC_REPORT_FIELDS
          assert data["stage"] == "CLIVOX_V2_P9_PRIVATE_FIRST_INERT_PREFLIGHT_ONLY"
          assert data["channel_id"] == "UCfPEvy0SefE_5nNlYlY_CyQ"
          assert data["p8_unsigned_packet_bound_to_exact_video"] is True
          assert data["inert_private_first_template_validated"] is True
