name: Publish Artifact to YouTube

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode metadata path"
        required: true
        type: string
      source_run_id:
        description: "Render workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "Render artifact name"
        required: true
        type: string
      video_file:
        description: "Video filename inside artifact"
        required: true
        type: string
      captions_file:
        description: "Caption filename inside artifact"
        required: true
        type: string
      thumbnail_file:
        description: "Thumbnail filename inside artifact"
        required: true
        type: string
      receipt:
        description: "Publication receipt path"
        required: true
        type: string
      publish_at_utc:
        description: "Exact future UTC scheduled time e.g. 2026-10-24T05:30:00Z"
        required: true
        type: string
      video_sha256:
        description: "SHA256 of approved final MP4 bytes"
        required: true
        type: string
      approval_manifest:
        description: "Repo-relative JSON with five human release approvals and pinned video SHA"
        required: true
        type: string
      privacy:
        description: "Must remain private until YouTube publishAt"
        required: true
        default: "private"
        type: choice
        options:
          - private

permissions:
  contents: write
  actions: read

# Never start simultaneous upload jobs to this channel.
concurrency:
  group: flowminute-youtube-verified-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh run download "${{ inputs.source_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.artifact_name }}" \
            --dir incoming
          test -f "incoming/${{ inputs.video_file }}"

      - name: Validate release metadata
        run: python scripts/validate_release.py "${{ inputs.episode }}"

      - name: Install YouTube API client
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Upload exact artifact to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          python scripts/publish_youtube.py \
            --episode "${{ inputs.episode }}" \
            --video "incoming/${{ inputs.video_file }}" \
            --captions "incoming/${{ inputs.captions_file }}" \
            --thumbnail "incoming/${{ inputs.thumbnail_file }}" \
            --privacy "${{ inputs.privacy }}" \
            --schedule-at-utc "${{ inputs.publish_at_utc }}" \
            --expected-sha256 "${{ inputs.video_sha256 }}" \
            --expected-channel-id "UCCcL9Q_jqVq6LJmnYUSAFZA" \
            --approval-manifest "${{ inputs.approval_manifest }}" \
            --receipt "${{ inputs.receipt }}" \
            --confirm-publish

      - name: Commit confirmed schedule receipt or incomplete-upload recovery checkpoint
        if: always()
        shell: bash
        env:
          RECEIPT_FILE: ${{ inputs.receipt }}
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! [[ "$RECEIPT_FILE" =~ ^state/published/[A-Za-z0-9_.-]+\.json$ ]]; then
            echo "Unsafe receipt file; refuse to touch Git history" >&2
            exit 1
          fi
          git add -- "$RECEIPT_FILE"
          if [ -f "$RECEIPT_FILE.pending.json" ]; then
            git add -- "$RECEIPT_FILE.pending.json"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Record recoverable YouTube upload status (scheduled only after API readback)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
