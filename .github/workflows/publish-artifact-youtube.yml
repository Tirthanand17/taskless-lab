name: Publish Artifact to YouTube

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode metadata path"
        required: true
        type: string
      source_run_id:
        description: "Render workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "Render artifact name"
        required: true
        type: string
      video_file:
        description: "Video filename inside artifact"
        required: true
        type: string
      captions_file:
        description: "Caption filename inside artifact"
        required: true
        type: string
      thumbnail_file:
        description: "Thumbnail filename inside artifact"
        required: true
        type: string
      receipt:
        description: "Publication receipt path"
        required: true
        type: string
      publish_at_utc:
        description: "Exact future UTC scheduled time e.g. 2026-10-24T05:30:00Z"
        required: true
        type: string
      video_sha256:
        description: "SHA256 of approved final MP4 bytes"
        required: true
        type: string
      approval_manifest:
        description: "Repo-relative JSON with five human release approvals and pinned video SHA"
        required: true
        type: string
      privacy:
        description: "Must remain private until YouTube publishAt"
        required: true
        default: "private"
        type: choice
        options:
          - private

permissions:
  contents: write
  actions: read

# Never start simultaneous upload jobs to this channel.
concurrency:
  group: flowminute-youtube-verified-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    env:
      FM_EPISODE: ${{ inputs.episode }}
      FM_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      FM_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      FM_VIDEO_FILE: ${{ inputs.video_file }}
      FM_CAPTIONS_FILE: ${{ inputs.captions_file }}
      FM_THUMBNAIL_FILE: ${{ inputs.thumbnail_file }}
      FM_RECEIPT: ${{ inputs.receipt }}
      FM_PUBLISH_AT_UTC: ${{ inputs.publish_at_utc }}
      FM_VIDEO_SHA256: ${{ inputs.video_sha256 }}
      FM_APPROVAL_MANIFEST: ${{ inputs.approval_manifest }}
      FM_PRIVACY: ${{ inputs.privacy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate manual dispatch inputs before external APIs
        run: |
          set -euo pipefail
          python -m scripts.validate_publish_dispatch_b4f0 dispatch

      - name: Download only a successful main-branch render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$FM_SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json headBranch,headSha,conclusion,event \
            | python -m scripts.validate_publish_dispatch_b4f0 source
          mkdir -p incoming
          gh run download "$FM_SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$FM_ARTIFACT_NAME" \
            --dir incoming
          python -m scripts.validate_publish_dispatch_b4f0 files

      - name: Validate release metadata
        run: |
          set -euo pipefail
          python scripts/validate_release.py "$FM_EPISODE"

      - name: Install YouTube API client
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib cryptography==50.0.2

      - name: Upload exact artifact to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
          FLOWMINUTE_OWNER_RELEASE_ED25519_PUBLIC_HEX: ${{ vars.FLOWMINUTE_OWNER_RELEASE_ED25519_PUBLIC_HEX }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/publish_youtube.py \
            --episode "$FM_EPISODE" \
            --video "incoming/$FM_VIDEO_FILE" \
            --captions "incoming/$FM_CAPTIONS_FILE" \
            --thumbnail "incoming/$FM_THUMBNAIL_FILE" \
            --privacy "$FM_PRIVACY" \
            --schedule-at-utc "$FM_PUBLISH_AT_UTC" \
            --expected-sha256 "$FM_VIDEO_SHA256" \
            --expected-channel-id "UCCcL9Q_jqVq6LJmnYUSAFZA" \
            --approval-manifest "$FM_APPROVAL_MANIFEST" \
            --receipt "$FM_RECEIPT" \
            --confirm-publish

      - name: Commit confirmed schedule receipt or incomplete-upload recovery checkpoint
        if: always()
        shell: bash
        env:
          RECEIPT_FILE: ${{ inputs.receipt }}
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! [[ "$RECEIPT_FILE" =~ ^state/published/[A-Za-z0-9_.-]+\.json$ ]]; then
            echo "Unsafe receipt file; refuse to touch Git history" >&2
            exit 1
          fi
          if [ ! -f "$RECEIPT_FILE" ] && [ ! -f "$RECEIPT_FILE.pending.json" ]; then
            echo "No remote upload recorded; nothing to checkpoint"
            exit 0
          fi
          if [ -f "$RECEIPT_FILE" ]; then
            git add -- "$RECEIPT_FILE"
          fi
          if [ -f "$RECEIPT_FILE.pending.json" ]; then
            git add -- "$RECEIPT_FILE.pending.json"
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Record recoverable YouTube upload status (scheduled only after API readback)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
