name: Publish Artifact to YouTube — owner-approved private pilot ONLY

# This workflow is DRAFT/unmerged; it DOES NOT initiate an upload.
# A protected environment and TWO separately configured owner flags are
# required before ANY manual private upload is allowed.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Validated episode metadata under content/episodes/"
        required: true
        type: string
      source_run_id:
        description: "Numeric render workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "Single safe artifact name"
        required: true
        type: string
      video_file:
        description: "MP4 basename inside artifact"
        required: true
        type: string
      captions_file:
        description: "SRT basename inside artifact"
        required: true
        type: string
      thumbnail_file:
        description: "PNG basename inside artifact"
        required: true
        type: string
      receipt:
        description: "Receipt path under state/published/"
        required: true
        type: string
      privacy:
        description: "PRIVATE pilot only; other privacy levels need owner authorization"
        required: true
        default: "private"
        type: choice
        options:
          - private

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ vars.PUBLISH_ENABLED == 'true' && vars.FLOWMINUTE_OWNER_PRIVATE_PILOT_APPROVED == 'true' }}
    runs-on: ubuntu-24.04
    environment: youtube-production
    timeout-minutes: 15
    env:
      EPISODE_PATH: ${{ inputs.episode }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      VIDEO_FILE: ${{ inputs.video_file }}
      CAPTIONS_FILE: ${{ inputs.captions_file }}
      THUMBNAIL_FILE: ${{ inputs.thumbnail_file }}
      RECEIPT_PATH: ${{ inputs.receipt }}
      PRIVACY: ${{ inputs.privacy }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  # restricted to protected owner-approved pilot job; receipt needs push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reject unsafe manual dispatch inputs BEFORE artifact download
        run: python scripts/validate_publisher_dispatch.py

      - name: Download the exact render artifact as untrusted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir incoming
          python scripts/validate_publisher_dispatch.py --check-artifact-root incoming

      - name: Validate the original release metadata
        run: |
          set -euo pipefail
          python scripts/validate_release.py "$EPISODE_PATH"

      - name: Install official YouTube client ONLY after owner-and-file gates
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Owner-approved PRIVATE YouTube upload only (NO automatic public)
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          python scripts/publish_youtube.py \
            --episode "$EPISODE_PATH" \
            --video "incoming/$VIDEO_FILE" \
            --captions "incoming/$CAPTIONS_FILE" \
            --thumbnail "incoming/$THUMBNAIL_FILE" \
            --privacy "$PRIVACY" \
            --receipt "$RECEIPT_PATH" \
            --confirm-publish

      - name: Commit receipt without ever using dispatch inputs as shell code
        run: |
          set -euo pipefail
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$RECEIPT_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "Record approved private YouTube pilot publication receipt"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
