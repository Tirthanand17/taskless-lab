name: Publish Artifact to YouTube

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode metadata path"
        required: true
        type: string
      source_run_id:
        description: "Render workflow run ID"
        required: true
        type: string
      artifact_name:
        description: "Render artifact name"
        required: true
        type: string
      video_file:
        description: "Video filename inside artifact"
        required: true
        type: string
      captions_file:
        description: "Caption filename inside artifact"
        required: true
        type: string
      thumbnail_file:
        description: "Thumbnail filename inside artifact"
        required: true
        type: string
      receipt:
        description: "Publication receipt path"
        required: true
        type: string
      privacy:
        description: "YouTube privacy"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p incoming
          gh run download "${{ inputs.source_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ inputs.artifact_name }}" \
            --dir incoming
          test -f "incoming/${{ inputs.video_file }}"

      - name: Validate release metadata
        run: python scripts/validate_release.py "${{ inputs.episode }}"

      - name: Install YouTube API client
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib

      - name: Upload exact artifact to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          python scripts/publish_youtube.py \
            --episode "${{ inputs.episode }}" \
            --video "incoming/${{ inputs.video_file }}" \
            --captions "incoming/${{ inputs.captions_file }}" \
            --thumbnail "incoming/${{ inputs.thumbnail_file }}" \
            --privacy "${{ inputs.privacy }}" \
            --receipt "${{ inputs.receipt }}" \
            --confirm-publish

      - name: Commit publication receipt
        shell: bash
        run: |
          git config user.name "flowminute-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.receipt }}"
          git diff --cached --quiet && exit 0
          git commit -m "Record YouTube publication receipt: ${{ inputs.episode }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
