name: FlowMinute YouTube Readonly Recovery (NO UPLOAD)

on:
  workflow_dispatch:
    inputs:
      pending_receipt:
        description: "Existing state/published/NAME.json.pending.json committed by an earlier manual upload"
        type: string
        required: true
      episode:
        description: "Matching content/episodes/NAME.json; no new upload performed"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: flowminute-owner-readonly-recovery
  cancel-in-progress: false

jobs:
  verify_existing_only:
    # Intentionally MANUAL and owner-environment protected. No scheduled
    # trigger, no upload, no contents write, no privileged GitHub token.
    if: ${{ github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && vars.FLOWMINUTE_READONLY_RECOVERY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: youtube-production
    env:
      FM_PENDING_RECEIPT: ${{ inputs.pending_receipt }}
      FM_EPISODE: ${{ inputs.episode }}
      FLOWMINUTE_READONLY_RECOVERY_ENABLED: ${{ vars.FLOWMINUTE_READONLY_RECOVERY_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install owner READ-ONLY SDK (never an uploader)
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib
      - name: Recheck ONLY the existing video and caption ID, no insert
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python -m scripts.reconcile_pending_youtube_b4f3
      - name: Retain ONLY the sanitized read-only receipt for seven days
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-b4f3-existing-video-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/flowminute-b4f3-readonly-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary read-only receipt even on failure
        if: always()
        run: rm -f "${RUNNER_TEMP}/flowminute-b4f3-readonly-receipt.json"
