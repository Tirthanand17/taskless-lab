name: FlowMinute Autopilot safe unit tests
on:
  workflow_dispatch:
  push:
    paths:
      - "autopilot/**"
      - ".github/workflows/autopilot-safe-tests.yml"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed control-plane tests (no credentials)
        run: python -m unittest discover -s autopilot -p 'test_*.py' -v
