name: Branch 3 Clivox A10 Protected Read-Only Analytics Adapter QA (NO GOOGLE)

on:
  pull_request:
    paths:
      - 'scripts/branch3_a10_owner_readonly.py'
      - 'scripts/test_branch3_a10_owner_readonly.py'
      - 'branch3/a10/**'
      - 'branch3/architecture/**'
      - '.github/workflows/branch3-clivox-a10-owner-readonly.yml'
      - '.github/workflows/branch3-clivox-a10-owner-readonly-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict_owner_analytics_and_channel_binding_mocked:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_ANALYTICS_GOOGLE_CREDENTIALS_INSTALLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_ANALYTICS_WRITE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline adversarial Analytics OAuth scopes, Clivox owner and metrics checks
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a10_owner_readonly.py scripts/test_branch3_a10_owner_readonly.py
          python -B -m unittest -v scripts.test_branch3_a10_owner_readonly scripts.test_branch3_a10_analytics scripts.test_branch3_a7_readonly_youtube
      - name: Prove no Google/OAuth consent or private analytics ever run in fixture
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a10_owner_readonly --mode fixture > "$RUNNER_TEMP/clivox-a10-readonly-fixture.json"
          python -B -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a10-readonly-fixture.json").read_text()); assert d["strict_dual_readonly_scopes_required"] and d["channel_identity_before_reports_required"] and not d["real_owner_google_oauth_consent_completed"] and not d["real_analytics_report_checked"] and not d["real_clivox_video_metrics_observed"] and d["actual_google_requests"]==0 and not d["youtube_upload_authorized"] and not d["youtube_schedule_authorized"] and not d["youtube_publish_authorized"]; print("CLIVOX_A10_ANALYTICS_ONLY_MOCK_NO_OAUTH")'
      - name: Assert no live Google, no source media and no YouTube mutation
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_ANALYTICS_GOOGLE_CREDENTIALS_INSTALLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_ANALYTICS_WRITE_ENABLED" = 'false'
      # Never access protected environment, private reports or bearer tokens in PR CI.
