name: Configure YouTube Brand Channel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: ${{ vars.CHANNEL_CONFIG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install google-api-python-client google-auth
      - name: Configure description, keywords and banner
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CHANNEL_CONFIG_ENABLED: ${{ vars.CHANNEL_CONFIG_ENABLED }}
        run: python scripts/configure_youtube_channel.py
