name: Clivox A3 Owner-Approved Private Vault Visibility READ-ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a3-vault-private-readback
  cancel-in-progress: false

jobs:
  owner_approved_private_vault_readback:
    if: github.repository == 'Tirthanand17/taskless-lab' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'Tirthanand17' && github.triggering_actor == 'Tirthanand17' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: clivox-vault-readonly
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_MEDIA_DOWNLOAD_ENABLED: 'false'
      CLIVOX_MEDIA_STORAGE_WRITE_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_A3_OWNER_APPROVED_VAULT_NAME: ${{ secrets.CLIVOX_A3_OWNER_APPROVED_VAULT_NAME }}
      CLIVOX_A3_VAULT_METADATA_READ_TOKEN: ${{ secrets.CLIVOX_A3_VAULT_METADATA_READ_TOKEN }}
      CLIVOX_A3_VAULT_READBACK_APPROVED: ${{ secrets.CLIVOX_A3_VAULT_READBACK_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact manual main owner run and deny all write operations
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Tirthanand17/taskless-lab'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_ACTOR" = 'Tirthanand17'
          test "$GITHUB_TRIGGERING_ACTOR" = 'Tirthanand17'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_DOWNLOAD_ENABLED" = 'false'
          test "$CLIVOX_MEDIA_STORAGE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
      - name: Read only owner-approved GitHub private repo metadata and collaborator boundary
        run: |
          python -B -m scripts.branch3_a3_private_vault_readback --mode live
      # No artifact, no private vault name, no collaborator list, no token,
      # no repository transfers or source/video/media API operations.
