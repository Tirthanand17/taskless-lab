name: Branch 3 Clivox A8 Transactional Upload Attempt Ledger QA (NO YOUTUBE)

on:
  pull_request:
    paths:
      - "scripts/branch3_a8_attempt_ledger.py"
      - "scripts/test_branch3_a8_attempt_ledger.py"
      - "branch3/a8/**"
      - "branch3/architecture/**"
      - ".github/workflows/branch3-clivox-a8-atomic-ledger-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clivox-a8-local-atomic-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove_runner_local_transactions_without_youtube:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PUBLISH_ENABLED: 'false'
      CLIVOX_YOUTUBE_WRITE_ENABLED: 'false'
      CLIVOX_UPLOAD_LEDGER_CROSS_RUN_DURABLE: 'false'
      CLIVOX_REMOTE_INVENTORY_VERIFIED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all SQLite concurrency, ambiguous outcome and strict no-retry controls
        run: |
          set -euo pipefail
          python -B -m py_compile scripts/branch3_a8_attempt_ledger.py scripts/test_branch3_a8_attempt_ledger.py
          python -B -m unittest -v scripts.test_branch3_a8_attempt_ledger scripts.test_branch3_a8_private_first_dryrun
      - name: Run source-free GitHub-runner-only atomic ledger rehearsal
        run: |
          set -euo pipefail
          python -B -m scripts.branch3_a8_attempt_ledger --mode fixture > "$RUNNER_TEMP/clivox-a8-ephemeral-summary.json"
          python -B -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"clivox-a8-ephemeral-summary.json"; d=json.loads(p.read_text()); assert d["ephemeral_sqlite_atomic_reservation_tested"] and d["ambiguous_attempt_stays_blocked"] and not d["database_retained_after_job"] and not d["cross_runner_durable_ledger_exists"] and not d["real_remote_inventory_reconciled"] and d["real_creator_licenses"]==0 and not d["youtube_upload_authorized"] and not d["youtube_schedule_authorized"] and not d["youtube_publish_authorized"] and d["actual_youtube_api_calls"]==0; print("CLIVOX_A8_SQLITE_ATOMIC_REHEARSAL_NO_LIVE_RELEASE")'
      - name: No cross-run storage, no media, no Google writes
        run: |
          test "$PUBLISH_ENABLED" = 'false'
          test "$CLIVOX_YOUTUBE_WRITE_ENABLED" = 'false'
          test "$CLIVOX_UPLOAD_LEDGER_CROSS_RUN_DURABLE" = 'false'
          test "$CLIVOX_REMOTE_INVENTORY_VERIFIED" = 'false'
      # Runner temporary database is deleted; no artifacts, media or secrets.
