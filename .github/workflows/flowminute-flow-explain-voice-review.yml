name: FLOWMINUTE FLOW EXPLAIN English Voice Review (no publish)
on:
  push:
    branches:
      - "feature/oct24-multicharacter-3d-lesson-contract"
    paths:
      - "scripts/produce_flow_explain_voice_review.py"
      - "motion-v2/script-flow-explain-en.txt"
      - ".github/workflows/flowminute-flow-explain-voice-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowminute-flow-explain-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_english_listening_preview:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
      OMP_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source voice tools (no paid API)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
          python -m pip install --disable-pip-version-check --no-input 'kokoro-onnx==0.6.1' numpy soundfile
      - name: Fetch public Kokoro model into ephemeral runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kokoro" "$RUNNER_TEMP/review"
          base="https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1"
          curl --fail --location --retry 2 --max-time 220 "$base/kokoro-v1.0.onnx" -o "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx"
          curl --fail --location --retry 2 --max-time 220 "$base/voices-v1.0.bin" -o "$RUNNER_TEMP/kokoro/voices-v1.0.bin"
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx")" -gt 1000000
          test "$(stat -c%s "$RUNNER_TEMP/kokoro/voices-v1.0.bin")" -gt 100000
      - name: Generate original English voice listening take
        run: |
          set -euo pipefail
          python scripts/produce_flow_explain_voice_review.py \
            --model-dir "$RUNNER_TEMP/kokoro" \
            --script motion-v2/script-flow-explain-en.txt \
            --out "$RUNNER_TEMP/review/flow_explain_agent_permissions_en_REVIEW_ONLY.wav"
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          f=Path(os.environ["RUNNER_TEMP"])/"review"/"flow_explain_agent_permissions_en_REVIEW_ONLY.qa.json"
          data=json.loads(f.read_text())
          assert data["voice_only_silence"]["pass"] is True,data["voice_only_silence"]
          assert data["human_listening_approved"] is False
          assert data["captions_synced"] is False
          assert data["published_to_youtube"] is False
          print("VOICE_ONLY_QA_PASS_NO_UPLOAD")
          PY
          ffmpeg -hide_banner -loglevel error -xerror \
            -i "$RUNNER_TEMP/review/flow_explain_agent_permissions_en_REVIEW_ONLY.wav" -f null -
      - name: Keep synthetic voice for owner listening review only
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-agent-permissions-en-natural-voice-review
          path: |
            ${{ runner.temp }}/review/flow_explain_agent_permissions_en_REVIEW_ONLY.wav
            ${{ runner.temp }}/review/flow_explain_agent_permissions_en_REVIEW_ONLY.qa.json
          retention-days: 1
          if-no-files-found: error
