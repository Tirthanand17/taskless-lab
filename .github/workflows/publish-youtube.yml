name: Publish to YouTube

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: "Initial YouTube privacy"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - unlisted
          - public

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: youtube-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YouTube API client
        run: python -m pip install google-api-python-client google-auth google-auth-oauthlib
      - name: Validate release before upload
        run: python scripts/validate_release.py content/episodes/pilot_001.json
      - name: Upload video and SRT
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          python scripts/publish_youtube.py \
            --episode content/episodes/pilot_001.json \
            --video assets/pilot_001/pilot_001_final.mp4 \
            --captions assets/pilot_001/captions.srt \
            --privacy "${{ inputs.privacy }}" \
            --confirm-publish
