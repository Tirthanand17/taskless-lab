name: FlowMinute B4e7 Old Video CI Cost Boundary (NO MEDIA OR UPLOAD)

on:
  pull_request:
    paths:
      - ".github/workflows/flowminute-b4e3-cinematic-three-video-review.yml"
      - ".github/workflows/flowminute-b4e4c-floating-three-video-review.yml"
      - ".github/workflows/flowminute-b3d4c2c3b-full-original-narration.yml"
      - ".github/workflows/flowminute-b4e3d-one-real-aac-challenge.yml"
      - ".github/workflows/flowminute-b4e7-legacy-ci-cost-guard.yml"
      - "autopilot/test_b4e7_legacy_ci_cost_guard.py"
      - "docs/adr/0064-b4e7-bounded-legacy-voice-renderer-qa.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flowminute-b4e3-cinematic-three-video-review.yml"
      - ".github/workflows/flowminute-b4e4c-floating-three-video-review.yml"
      - ".github/workflows/flowminute-b3d4c2c3b-full-original-narration.yml"
      - ".github/workflows/flowminute-b4e3d-one-real-aac-challenge.yml"
      - ".github/workflows/flowminute-b4e7-legacy-ci-cost-guard.yml"
      - "autopilot/test_b4e7_legacy_ci_cost_guard.py"

permissions:
  contents: read

concurrency:
  group: flowminute-b4e7-retired-proof-budget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static_budget_and_publish_off_policy:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ENABLE_GEMINI: "0"
      FLOWMINUTE_MODEL_PAID_SPEND_USD: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify legacy full renders are manual while current source QA remains
        run: |
          set -euo pipefail
          python -B -m unittest -v autopilot.test_b4e7_legacy_ci_cost_guard
          echo "B4E7_RETIRED_HEAVY_KOKORO_JOBS_EXPLICIT_MAIN_DISPATCH_ONLY"
      - name: Confirm no AWS, YouTube or paid model activation
        run: |
          set -euo pipefail
          test "$PUBLISH_ENABLED" = false
          test "$FLOWMINUTE_ENABLE_PUBLISH" = 0
          test "$FLOWMINUTE_ENABLE_GEMINI" = 0
          test "$FLOWMINUTE_MODEL_PAID_SPEND_USD" = 0
          test "$FLOWMINUTE_ALLOW_LAPTOP" = 0
          echo "B4E7_NO_MEDIA_DOWNLOAD_NO_OWNER_SECRETS_NO_PUBLISH"
