name: FlowMinute Daily Cloud Autopilot Foundation (NO PUBLISH)

on:
  # GitHub only triggers scheduled workflows from the DEFAULT branch.
  # 13:17 UTC = 18:47 IST. Make TOMORROW's unverified 3-slot plan.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      retain_rehearsal_review_artifact:
        description: "Manual opt-in: retain 3 UNAPPROVED original MP4s in GitHub Actions for 1 day; all readers with repo read access can download"
        required: false
        type: boolean
        default: false
  push:
    branches: [main, feature/flowminute-cloud-autopilot-v1]
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/reconcile_daily_editorial_plan.py"
      - "autopilot/source_locked_script_briefs.py"
      - "autopilot/nonfactual_narration_rehearsal.py"
      - "autopilot/real_rehearsal_voice_media_b4e0.py"
      - "autopilot/full_original_rehearsal_media_b4e1.py"
      - "autopilot/cinematic_scene_board_b4f9.py"
      - "autopilot/quick_storyboard_contact_sheet_b4g0.py"
      - "autopilot/test_quick_storyboard_contact_sheet_b4g0.py"
      - ".github/workflows/flowminute-editorial-storyboard-review-b4g0.yml"
      - "autopilot/test_cinematic_scene_board_b4f9.py"
      - "autopilot/full_original_caption_ass_b4f7.py"
      - "autopilot/test_full_original_caption_ass_b4f7.py"
      - "autopilot/manual_rehearsal_review_export_b4e3.py"
      - "autopilot/rehearsal_encoded_signal_review_b4f4.py"
      - "autopilot/owner_signal_timeline_b4f5.py"
      - "autopilot/test_owner_signal_timeline_b4f5.py"
      - "autopilot/test_rehearsal_encoded_signal_review_b4f4.py"
      - "autopilot/review_worksheet_validator_b4e6.py"
      - "autopilot/offline_review_portal_b4e7.py"
      - "autopilot/youtube_private_resumable_contract_b4e8.py"
      - "autopilot/test_youtube_private_resumable_contract_b4e8.py"
      - "autopilot/test_offline_review_portal_b4e7.py"
      - "autopilot/test_review_worksheet_validator_b4e6.py"
      - "autopilot/test_manual_rehearsal_review_export_b4e3.py"
      - "autopilot/test_full_original_rehearsal_media_b4e1.py"
      - "autopilot/test_b4e2_pacing_captions_animated_reveal.py"
      - "autopilot/test_real_rehearsal_voice_media_b4e0.py"
      - "autopilot/test_b4e0b_wheel_only_voice_runner.py"
      - "autopilot/test_nonfactual_narration_rehearsal_b4d9.py"
      - "autopilot/recent_research_history.py"
      - "autopilot/test_recent_research_history_b4d8.py"
      - "autopilot/public_article_passages.py"
      - "autopilot/ephemeral_claim_review_docket.py"
      - "autopilot/test_ephemeral_claim_review_docket_b4d7.py"
      - "autopilot/test_source_locked_script_briefs.py"
      - "autopilot/test_reconcile_daily_editorial_plan.py"
      - "autopilot/test_daily_editorial_board.py"
      - "autopilot/evidence_probe.py"
      - "autopilot/test_evidence_probe.py"
      - "autopilot/test_arxiv_primary_feed_b4d4.py"
      - "autopilot/test_source_fetch_diagnostics_b4d3.py"
      - "autopilot/script_draft_agent.py"
      - "autopilot/test_script_draft_agent.py"
      - "autopilot/test_daily_cloud_plan.py"
      - "autopilot/daily_evidence_bundle.py"
      - "autopilot/test_daily_evidence_bundle.py"
      - "autopilot/agent_org.py"
      - ".github/workflows/flowminute-daily-cloud-foundation.yml"
  pull_request:
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/reconcile_daily_editorial_plan.py"
      - "autopilot/source_locked_script_briefs.py"
      - "autopilot/nonfactual_narration_rehearsal.py"
      - "autopilot/real_rehearsal_voice_media_b4e0.py"
      - "autopilot/full_original_rehearsal_media_b4e1.py"
      - "autopilot/cinematic_scene_board_b4f9.py"
      - "autopilot/quick_storyboard_contact_sheet_b4g0.py"
      - "autopilot/test_quick_storyboard_contact_sheet_b4g0.py"
      - ".github/workflows/flowminute-editorial-storyboard-review-b4g0.yml"
      - "autopilot/test_cinematic_scene_board_b4f9.py"
