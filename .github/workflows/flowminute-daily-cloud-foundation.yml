name: FlowMinute Daily Cloud Autopilot Foundation (NO PUBLISH)

on:
  # GitHub only triggers scheduled workflows from the DEFAULT branch.
  # 13:17 UTC = 18:47 IST. Make TOMORROW's unverified 3-slot plan.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main, feature/flowminute-cloud-autopilot-v1]
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/reconcile_daily_editorial_plan.py"
      - "autopilot/source_locked_script_briefs.py"
      - "autopilot/public_article_passages.py"
      - "autopilot/ephemeral_claim_review_docket.py"
      - "autopilot/test_ephemeral_claim_review_docket_b4d7.py"
      - "autopilot/test_source_locked_script_briefs.py"
      - "autopilot/test_reconcile_daily_editorial_plan.py"
      - "autopilot/test_daily_editorial_board.py"
      - "autopilot/evidence_probe.py"
      - "autopilot/test_evidence_probe.py"
      - "autopilot/test_arxiv_primary_feed_b4d4.py"
      - "autopilot/test_source_fetch_diagnostics_b4d3.py"
      - "autopilot/script_draft_agent.py"
      - "autopilot/test_script_draft_agent.py"
      - "autopilot/test_daily_cloud_plan.py"
      - "autopilot/daily_evidence_bundle.py"
      - "autopilot/test_daily_evidence_bundle.py"
      - "autopilot/agent_org.py"
      - ".github/workflows/flowminute-daily-cloud-foundation.yml"
  pull_request:
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/reconcile_daily_editorial_plan.py"
      - "autopilot/source_locked_script_briefs.py"
      - "autopilot/public_article_passages.py"
      - "autopilot/ephemeral_claim_review_docket.py"
      - "autopilot/test_ephemeral_claim_review_docket_b4d7.py"
      - "autopilot/test_source_locked_script_briefs.py"
      - "autopilot/test_reconcile_daily_editorial_plan.py"
      - "autopilot/test_daily_editorial_board.py"
      - "autopilot/evidence_probe.py"
      - "autopilot/test_evidence_probe.py"
      - "autopilot/test_arxiv_primary_feed_b4d4.py"
      - "autopilot/test_source_fetch_diagnostics_b4d3.py"
      - "autopilot/script_draft_agent.py"
      - "autopilot/test_script_draft_agent.py"
      - "autopilot/test_daily_cloud_plan.py"
      - "autopilot/daily_evidence_bundle.py"
      - "autopilot/test_daily_evidence_bundle.py"
      - ".github/workflows/flowminute-daily-cloud-foundation.yml"

permissions:
  contents: read

concurrency:
  group: flowminute-daily-draft-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unprivileged_draft:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout unprivileged public source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up free standard Python runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify 48-agent orchestration and strict no-publication gates
        run: |
          set -euo pipefail
          python -m unittest -v autopilot.test_agent_org autopilot.test_daily_cloud_plan autopilot.test_evidence_probe autopilot.test_source_fetch_diagnostics_b4d3 autopilot.test_script_draft_agent autopilot.test_daily_evidence_bundle autopilot.test_daily_editorial_board autopilot.test_reconcile_daily_editorial_plan autopilot.test_source_locked_script_briefs autopilot.test_ephemeral_claim_review_docket_b4d7 autopilot.test_arxiv_primary_feed_b4d4

      - name: Collect publicly available unverified headlines (not on PRs)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -m autopilot.scout --output out/flowminute-scout-unverified.json

      - name: Observe bounded official/public source bytes (NOT fact validation)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Official arXiv API policy: at most one request per three seconds.
          # The previous scout step may have fetched rss.arxiv.org last; keep
          # the entire run sequential, without concurrency or retry storms.
          sleep 3.2
          python -m autopilot.evidence_probe \
            --scout-report out/flowminute-scout-unverified.json \
            --max-sources 3 \
            --ephemeral-passages out/flowminute-ephemeral-source-passages.json \
            --output out/flowminute-evidence-unverified.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path("out/flowminute-evidence-unverified.json").read_text(encoding="utf8"))
          assert evidence["status"] == "PUBLIC_SOURCE_METADATA_ONLY_NOT_FACT_VERIFIED"
          assert evidence["source_probes_attempted"] <= 3
          assert evidence["source_probes_attempted"] == (evidence["sources_fetched"] + evidence["feed_entries_observed_only"] + evidence["sources_failed"])
          assert evidence["claims_verified"] == 0
          assert evidence["scripts_generated"] == 0
          assert evidence["youtube_upload_enabled"] is False
          assert evidence["youtube_schedule_enabled"] is False
          assert evidence["source_body_persisted"] is False
          assert evidence["billed_provider_calls"] == 0
          errors=evidence["direct_article_fetch_failure_counts"]
          assert type(errors) is dict and sum(errors.values()) == (
              evidence["feed_entries_observed_only"] + evidence["sources_failed"])
          assert evidence["source_articles_with_bounded_publisher_redirect"] <= evidence["sources_fetched"]
          # No article URLs, response text or server errors in these reason codes.
          print("B4D3_DIRECT_ARTICLE_DIAGNOSTIC_COUNTS_ONLY", json.dumps(errors,sort_keys=True))
          print("B4D3_PUBLISHER_ONLY_HTTPS_REDIRECT_ARTICLE_COUNT",
                evidence["source_articles_with_bounded_publisher_redirect"])
          print("SOURCE_OBSERVATION_ONLY: direct_pages", evidence["sources_fetched"],
                "publisher_RSS_entries_only", evidence["feed_entries_observed_only"],
                "failed", evidence["sources_failed"], "zero fact claims or uploads")
          PY

      - name: Plan three distinct tomorrow slots without producing any media
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -m autopilot.daily_cloud_plan \
            --scout-report out/flowminute-scout-unverified.json \
            --output out/flowminute-tomorrow-draft.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path("out/flowminute-tomorrow-draft.json").read_text(encoding="utf8"))
          assert plan["plan_kind"] == "UNPRIVILEGED_RESEARCH_DRAFT_ONLY"
          assert plan["specialist_roles"] == 48
          assert plan["task_contracts"] == 54
          assert not plan["youtube_upload_enabled"] and not plan["youtube_schedule_enabled"]
          assert not plan["cloud_publisher_connected"]
          assert not plan["any_content_verified"]
          assert not plan["new_billable_resources_enabled"]
          assert [x["format"] for x in plan["slots"]] == ["short","long","short"]
          assert [x["local_ist"] for x in plan["slots"]] == ["11:00","16:00","20:30"]
          assert all(not x["release_authorized"] and not x["real_media_exists"] for x in plan["slots"])
          evidence=json.loads(Path("out/flowminute-evidence-unverified.json").read_text(encoding="utf8"))
          lines=["# FlowMinute Cloud Autopilot — research-only draft",
                 "", "Target date (IST): "+plan["plan_date_ist"], "",
                 "3 video concepts planned: 2 Shorts + 1 long at 11:00 / 16:00 / 20:30 IST.",
                 "", "48 specialist roles and 54 source/evidence handoff contracts allocated.",
                 "", "Research leads: "+str(plan["research_lead_count"])+" (UNVERIFIED).",
                 "", "Evidence observations: "+str(evidence["sources_fetched"])+" direct pages, "+
                      str(evidence["feed_entries_observed_only"])+" RSS entries only; zero claims fact-verified.",
                 "", "**No scripts, voices, media, rights approval, OAuth, upload or schedule were created.**",
                 "", "All release gates remain disabled; plan is not ready to publish."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("GITHUB_ONLY_DAILY_DRAFT_SUCCESS_NO_UPLOAD_NO_SECRET_NO_LAPTOP")
          PY
      - name: Produce evidence-linked, non-repetitive original research questions (NO SCRIPTS)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.daily_editorial_board \
            --plan out/flowminute-tomorrow-draft.json \
            --scout-report out/flowminute-scout-unverified.json \
            --evidence out/flowminute-evidence-unverified.json \
            --board-output out/flowminute-ephemeral-editorial-board.json \
            --public-receipt-output out/flowminute-public-editorial-receipt.json
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          full=json.loads(Path("out/flowminute-ephemeral-editorial-board.json").read_text())
          receipt=json.loads(Path("out/flowminute-public-editorial-receipt.json").read_text())
          assert full["status"]=="B4D2_SOURCE_LINKED_DIVERSE_RESEARCH_BRIEFS_NO_FACT_APPROVAL"
          assert full["episode_count"]==3 and len(full["slots"])==3
          assert full["distinct_topics_selected"]<=3
          assert full["article_bytes_observed_selected"]<=3
          assert full["scripts_generated"]==0 and full["billable_api_calls"]==0
          assert full["release_authorized"] is False
          assert full["youtube_upload_enabled"] is False
          assert full["youtube_schedule_enabled"] is False
          assert receipt["fresh_original_scripts_completed"]==0
          assert receipt["real_youtube_uploads"]==0
          assert receipt["release_authorized"] is False
          assert receipt["headlines_urls_source_bodies_and_scripts_included"] is False
          assert receipt["direct_article_http_failure_counts"] == full["direct_article_http_failure_counts"]
          assert receipt["direct_articles_with_publisher_only_redirect"] == full["direct_articles_with_publisher_only_redirect"]
          assert all(key in ("HTTP_ACCESS_DENIED","HTTP_RATE_LIMITED",
                "HTTP_NOT_FOUND","HTTP_UNAVAILABLE","HTTP_OTHER",
                "TRANSPORT_UNAVAILABLE","REDIRECT_REJECTED",
                "UNEXPECTED_FINAL_URL","UNEXPECTED_HTTP_STATUS",
                "UNSUPPORTED_CONTENT_TYPE","ARTICLE_TOO_SMALL",
                "ARTICLE_TOO_LARGE",
                "BOT_CHALLENGE_PAGE","SOURCE_STRUCTURAL_REJECTED")
                for key in receipt["direct_article_http_failure_counts"])
          public=Path("out/flowminute-public-editorial-receipt.json").read_text()
          assert "https://" not in public and "unverified_title" not in public
          assert len(receipt["receipt_sha256"])==64
          # Source topic briefs may contain unverified headlines; keep those
          # ephemeral and NEVER ship their raw bytes as a public artifact.
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as w:
              w.write("\n## Editorial research triage (UNVERIFIED, no scripts)\n")
              w.write("Distinct topics found: "+str(full["distinct_topics_selected"])+"/3\n")
              w.write("Direct article byte observations: "+
                      str(full["article_bytes_observed_selected"])+"/3\n")
              w.write("Safe HTTP fetch failure types: "+
                      json.dumps(receipt["direct_article_http_failure_counts"],
                                 sort_keys=True)+"\n")
              w.write("Bounded same-publisher HTTPS redirects: "+
                      str(receipt["direct_articles_with_publisher_only_redirect"])+"\n")
              w.write("Question-only research angles; zero facts approved or releases.\n")
          print("B4D2_DISTINCT_RESEARCH_QUESTIONS_READY_ZERO_FACT_CLAIMS_ZERO_UPLOADS")
          PY

      - name: Reconcile three research slots with the independently observed-source editorial board
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.reconcile_daily_editorial_plan \
            --plan out/flowminute-tomorrow-draft.json \
            --board out/flowminute-ephemeral-editorial-board.json \
            --scout-report out/flowminute-scout-unverified.json \
            --source-observations out/flowminute-evidence-unverified.json \
            --output out/flowminute-reconciled-tomorrow-draft.json
          python -B - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("out/flowminute-reconciled-tomorrow-draft.json").read_text())
          b=json.loads(Path("out/flowminute-ephemeral-editorial-board.json").read_text())
          assert p["editorial_reconciliation_status"] == (
              "B4D5_EDITORIAL_PLAN_SOURCE_RECONCILED_NO_RELEASE")
          assert p["editorial_selected_unverified_topics"] == b["distinct_topics_selected"]
          assert p["editorial_selected_distinct_publishers"] == b["distinct_publishers_selected"]
          for selected,original in zip(p["slots"],b["slots"]):
              left=selected["research_lead"]
              right=original["research_lead"]
              assert (left["url"] if left else None) == (
                  right["unverified_url"] if right else None)
              assert (left["title"] if left else None) == (
                  right["unverified_title"] if right else None)
              assert selected["editorial_research_angle_id"]==original["angle_id"]
              assert selected["research_assignment_reconciled_unverified"] is True
              assert selected["real_script_exists"] is False
              assert selected["real_narration_exists"] is False
              assert selected["real_media_exists"] is False
              assert selected["release_authorized"] is False
              assert selected["youtube_uploaded"] is False
              assert selected["youtube_scheduled"] is False
          assert p["youtube_upload_enabled"] is False
          assert p["youtube_schedule_enabled"] is False
          assert p["maximum_incremental_spend_inr"]==0
          print("B4D5_CANONICAL_THREE_EDITORIAL_RESEARCH_TOPICS_ONLY_NO_RELEASE")
          PY

      - name: Build three original source-LOCKED research storyboard outlines (NO NARRATION)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.source_locked_script_briefs \
            --raw-plan out/flowminute-tomorrow-draft.json \
            --aligned-plan out/flowminute-reconciled-tomorrow-draft.json \
            --board out/flowminute-ephemeral-editorial-board.json \
            --scout out/flowminute-scout-unverified.json \
            --evidence out/flowminute-evidence-unverified.json \
            --output out/flowminute-ephemeral-source-locked-outlines.json
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads(Path("out/flowminute-ephemeral-source-locked-outlines.json").read_text())
          b=json.loads(Path("out/flowminute-ephemeral-editorial-board.json").read_text())
          assert x["status"]=="B4D6_EPISODE_LOCKED_CREATIVE_RESEARCH_OUTLINE_NO_FACT_APPROVAL"
          assert x["daily_slots"]==3
          assert x["direct_article_episode_briefs"]==b["article_bytes_observed_selected"]
          assert x["direct_article_episode_briefs"]+x["rss_only_episode_briefs"]+x["unobserved_episode_briefs"]==3
          assert x["eligible_for_external_model_calls"]==0
          assert x["actual_factual_scripts_generated"]==0
          assert x["actual_media_generated"]==0 and x["youtube_uploads"]==0
          assert x["paid_requests"]==0 and x["release_authorized"] is False
          for original in x["episodes"]:
              assert original["factual_script_drafted"] is False
              assert original["model_calls_made"]==0
              assert original["source_rights_approved"] is False
              assert original["owner_final_watch_approved"] is False
              assert original["youtube_uploaded"] is False
              assert original["youtube_scheduled"] is False
              assert original["release_authorized"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as w:
              w.write("\n## Source-locked original research/storyboard outlines (UNVERIFIED)\n")
              w.write("Original three-episode research outline structures produced: 3/3\n")
              w.write("Episode-scoped direct article-only model-context candidates: "+
                      str(x["direct_article_episode_briefs"])+"/3\n")
              w.write("RSS-only outlines: "+str(x["rss_only_episode_briefs"])+
                      "; headline-only: "+str(x["unobserved_episode_briefs"])+"\n")
              w.write("Zero provider model calls, zero factual scripts, zero media, zero uploads.\n")
          print("B4D6_SOURCE_LOCKED_ORIGINAL_RESEARCH_OUTLINES_CREATED_NO_MODEL_NO_UPLOAD")
          PY

      - name: Prepare exact-episode tiny passage claim investigation dockets (NO CLAIM APPROVAL)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.ephemeral_claim_review_docket \
            --original-plan out/flowminute-tomorrow-draft.json \
            --aligned-plan out/flowminute-reconciled-tomorrow-draft.json \
            --board out/flowminute-ephemeral-editorial-board.json \
            --scout out/flowminute-scout-unverified.json \
            --evidence out/flowminute-evidence-unverified.json \
            --briefs out/flowminute-ephemeral-source-locked-outlines.json \
            --passages out/flowminute-ephemeral-source-passages.json \
            --output out/flowminute-ephemeral-claim-review.json
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          docket=json.loads(Path("out/flowminute-ephemeral-claim-review.json").read_text())
          report=json.loads(Path("out/flowminute-evidence-unverified.json").read_text())
          assert docket["status"]=="EPHEMERAL_EPISODE_CLAIM_REVIEW_QUESTIONS_UNVERIFIED"
          assert docket["three_video_episodes"]==3
          assert docket["direct_article_episodes"]<=report["sources_fetched"]
          assert docket["direct_article_episodes_with_short_literal_review_passages"]<=docket["direct_article_episodes"]
          assert docket["short_literal_passage_review_questions"]<=6
          assert docket["semantic_claims_verified"]==0
          assert docket["independent_primary_corrobations"]==0
          assert docket["factual_scripts_generated"]==0
          assert docket["rights_approvals"]==0
          assert docket["external_ai_calls"]==0
          assert docket["youtube_uploads"]==0 and docket["release_authorized"] is False
          assert all(x["release_authorized"] is False and
                 x["factual_script_exists"] is False for x in docket["dockets"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as out:
              out.write("\n## B4d7 tiny source passage investigation (not fact review)\n")
              out.write("Direct article episodes: "+str(docket["direct_article_episodes"])+"/3\n")
              out.write("Read article episodes with 1-2 short literal passages: "+
                        str(docket["direct_article_episodes_with_short_literal_review_passages"])+"/3\n")
              out.write("Unverified investigation questions: "+
                        str(docket["short_literal_passage_review_questions"])+"\n")
              out.write("Excerpts held ephemerally, never in public artifact; zero claims approved, scripts or uploads.\n")
          print("B4D7_EPHEMERAL_CLAIM_INVESTIGATION_READY_ZERO_APPROVED_CLAIMS")
          PY

      - name: Prepare safe retained public research-only evidence receipt
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.daily_evidence_bundle \
            --plan out/flowminute-reconciled-tomorrow-draft.json \
            --evidence out/flowminute-evidence-unverified.json \
            --editorial-receipt out/flowminute-public-editorial-receipt.json \
            --output out/flowminute-public-research-draft-receipt.json
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("out/flowminute-public-research-draft-receipt.json")
          assert 200 <= path.stat().st_size <= 12000
          r=json.loads(path.read_text(encoding="utf8"))
          assert r["schema_version"] == 1
          assert len(r["slots"]) == 3
          assert r["status"] == "GITHUB_RETAINED_RESEARCH_DRAFT_EVIDENCE_ONLY"
          editorial=json.loads(Path("out/flowminute-public-editorial-receipt.json").read_text())
          assert r["editorial_and_plan_reconciled"] is True
          assert r["sanitized_editorial_receipt_sha256"] == editorial["receipt_sha256"]
          assert r["selected_distinct_research_topics"] == editorial["selected_distinct_topics"]
          assert all(x["release_authorized"] is False for x in editorial["slots"])
          assert r["raw_source_headlines_urls_and_bodies_retained"] is False
          assert "literal_excerpt_unverified" not in path.read_text()
          assert "literal_excerpt_unverified" not in Path(
              "out/flowminute-public-editorial-receipt.json").read_text()
          assert r["real_fact_or_rights_review_performed"] is False
          assert r["real_media_or_credentials_retained"] is False
          assert r["youtube_publishing_enabled"] is False
          assert r["independently_verified_unattended_youtube_releases"] == 0
          assert r["release_authorized"] is False
          lines=["", "## GitHub-only retained public research receipt",
                 "Next IST planning day: "+r["plan_day_ist"],
                 "Retained receipt SHA256: "+r["receipt_sha256"],
                 "No articles, source bodies, headlines, URLs, token values, media or approvals are retained.",
                 "21-live-video production proof: 0/21; no authenticated YouTube upload.",
                 "Artifact retention: up to 14 days under repository retention settings; this is not private permanent media escrow."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as stream:
              stream.write("\n".join(lines)+"\n")
          print("B4D1_SANITIZED_PUBLIC_DAILY_DRAFT_READY_NEVER_UPLOAD_TO_YOUTUBE")
          PY

      - name: Retain tiny sanitized future-day plan metadata in GitHub Actions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-unapproved-research-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/flowminute-public-research-draft-receipt.json
            out/flowminute-public-editorial-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Discard ephemeral unverified draft files
        if: always()
        run: rm -rf out/flowminute-scout-unverified.json out/flowminute-evidence-unverified.json out/flowminute-tomorrow-draft.json out/flowminute-public-research-draft-receipt.json out/flowminute-public-editorial-receipt.json out/flowminute-ephemeral-editorial-board.json out/flowminute-reconciled-tomorrow-draft.json out/flowminute-ephemeral-source-locked-outlines.json out/flowminute-ephemeral-source-passages.json out/flowminute-ephemeral-claim-review.json
