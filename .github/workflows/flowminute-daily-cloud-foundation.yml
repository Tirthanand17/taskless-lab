name: FlowMinute Daily Cloud Autopilot Foundation (NO PUBLISH)

on:
  # GitHub only triggers scheduled workflows from the DEFAULT branch.
  # 13:17 UTC = 18:47 IST. Make TOMORROW's unverified 3-slot plan.
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main, feature/flowminute-cloud-autopilot-v1]
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/test_daily_editorial_board.py"
      - "autopilot/evidence_probe.py"
      - "autopilot/test_evidence_probe.py"
      - "autopilot/script_draft_agent.py"
      - "autopilot/test_script_draft_agent.py"
      - "autopilot/test_daily_cloud_plan.py"
      - "autopilot/daily_evidence_bundle.py"
      - "autopilot/test_daily_evidence_bundle.py"
      - "autopilot/agent_org.py"
      - ".github/workflows/flowminute-daily-cloud-foundation.yml"
  pull_request:
    paths:
      - "autopilot/daily_cloud_plan.py"
      - "autopilot/daily_editorial_board.py"
      - "autopilot/test_daily_editorial_board.py"
      - "autopilot/evidence_probe.py"
      - "autopilot/test_evidence_probe.py"
      - "autopilot/script_draft_agent.py"
      - "autopilot/test_script_draft_agent.py"
      - "autopilot/test_daily_cloud_plan.py"
      - "autopilot/daily_evidence_bundle.py"
      - "autopilot/test_daily_evidence_bundle.py"
      - ".github/workflows/flowminute-daily-cloud-foundation.yml"

permissions:
  contents: read

concurrency:
  group: flowminute-daily-draft-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unprivileged_draft:
    if: github.repository == 'Tirthanand17/taskless-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CI: "true"
      PUBLISH_ENABLED: "false"
      FLOWMINUTE_ENABLE_PUBLISH: "0"
      FLOWMINUTE_ALLOW_LAPTOP: "0"
      FLOWMINUTE_DAILY_SPEND_CAP_USD: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout unprivileged public source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up free standard Python runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify 48-agent orchestration and strict no-publication gates
        run: |
          set -euo pipefail
          python -m unittest -v autopilot.test_agent_org autopilot.test_daily_cloud_plan autopilot.test_evidence_probe autopilot.test_script_draft_agent autopilot.test_daily_evidence_bundle autopilot.test_daily_editorial_board

      - name: Collect publicly available unverified headlines (not on PRs)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -m autopilot.scout --output out/flowminute-scout-unverified.json

      - name: Observe bounded official/public source bytes (NOT fact validation)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -m autopilot.evidence_probe \
            --scout-report out/flowminute-scout-unverified.json \
            --max-sources 3 \
            --output out/flowminute-evidence-unverified.json
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path("out/flowminute-evidence-unverified.json").read_text(encoding="utf8"))
          assert evidence["status"] == "PUBLIC_SOURCE_METADATA_ONLY_NOT_FACT_VERIFIED"
          assert evidence["source_probes_attempted"] <= 3
          assert evidence["source_probes_attempted"] == (evidence["sources_fetched"] + evidence["feed_entries_observed_only"] + evidence["sources_failed"])
          assert evidence["claims_verified"] == 0
          assert evidence["scripts_generated"] == 0
          assert evidence["youtube_upload_enabled"] is False
          assert evidence["youtube_schedule_enabled"] is False
          assert evidence["source_body_persisted"] is False
          assert evidence["billed_provider_calls"] == 0
          print("SOURCE_OBSERVATION_ONLY: direct_pages", evidence["sources_fetched"],
                "publisher_RSS_entries_only", evidence["feed_entries_observed_only"],
                "failed", evidence["sources_failed"], "zero fact claims or uploads")
          PY

      - name: Plan three distinct tomorrow slots without producing any media
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -m autopilot.daily_cloud_plan \
            --scout-report out/flowminute-scout-unverified.json \
            --output out/flowminute-tomorrow-draft.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          plan=json.loads(Path("out/flowminute-tomorrow-draft.json").read_text(encoding="utf8"))
          assert plan["plan_kind"] == "UNPRIVILEGED_RESEARCH_DRAFT_ONLY"
          assert plan["specialist_roles"] == 48
          assert plan["task_contracts"] == 54
          assert not plan["youtube_upload_enabled"] and not plan["youtube_schedule_enabled"]
          assert not plan["cloud_publisher_connected"]
          assert not plan["any_content_verified"]
          assert not plan["new_billable_resources_enabled"]
          assert [x["format"] for x in plan["slots"]] == ["short","long","short"]
          assert [x["local_ist"] for x in plan["slots"]] == ["11:00","16:00","20:30"]
          assert all(not x["release_authorized"] and not x["real_media_exists"] for x in plan["slots"])
          evidence=json.loads(Path("out/flowminute-evidence-unverified.json").read_text(encoding="utf8"))
          lines=["# FlowMinute Cloud Autopilot — research-only draft",
                 "", "Target date (IST): "+plan["plan_date_ist"], "",
                 "3 video concepts planned: 2 Shorts + 1 long at 11:00 / 16:00 / 20:30 IST.",
                 "", "48 specialist roles and 54 source/evidence handoff contracts allocated.",
                 "", "Research leads: "+str(plan["research_lead_count"])+" (UNVERIFIED).",
                 "", "Evidence observations: "+str(evidence["sources_fetched"])+" direct pages, "+
                      str(evidence["feed_entries_observed_only"])+" RSS entries only; zero claims fact-verified.",
                 "", "**No scripts, voices, media, rights approval, OAuth, upload or schedule were created.**",
                 "", "All release gates remain disabled; plan is not ready to publish."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(lines)+"\n")
          print("GITHUB_ONLY_DAILY_DRAFT_SUCCESS_NO_UPLOAD_NO_SECRET_NO_LAPTOP")
          PY
      - name: Produce evidence-linked, non-repetitive original research questions (NO SCRIPTS)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.daily_editorial_board \
            --plan out/flowminute-tomorrow-draft.json \
            --scout-report out/flowminute-scout-unverified.json \
            --evidence out/flowminute-evidence-unverified.json \
            --board-output out/flowminute-ephemeral-editorial-board.json \
            --public-receipt-output out/flowminute-public-editorial-receipt.json
          python -B - <<'PY'
          import json,os
          from pathlib import Path
          full=json.loads(Path("out/flowminute-ephemeral-editorial-board.json").read_text())
          receipt=json.loads(Path("out/flowminute-public-editorial-receipt.json").read_text())
          assert full["status"]=="B4D2_SOURCE_LINKED_DIVERSE_RESEARCH_BRIEFS_NO_FACT_APPROVAL"
          assert full["episode_count"]==3 and len(full["slots"])==3
          assert full["distinct_topics_selected"]<=3
          assert full["article_bytes_observed_selected"]<=3
          assert full["scripts_generated"]==0 and full["billable_api_calls"]==0
          assert full["release_authorized"] is False
          assert full["youtube_upload_enabled"] is False
          assert full["youtube_schedule_enabled"] is False
          assert receipt["fresh_original_scripts_completed"]==0
          assert receipt["real_youtube_uploads"]==0
          assert receipt["release_authorized"] is False
          assert receipt["headlines_urls_source_bodies_and_scripts_included"] is False
          public=Path("out/flowminute-public-editorial-receipt.json").read_text()
          assert "https://" not in public and "unverified_title" not in public
          assert len(receipt["receipt_sha256"])==64
          # Source topic briefs may contain unverified headlines; keep those
          # ephemeral and NEVER ship their raw bytes as a public artifact.
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as w:
              w.write("\n## Editorial research triage (UNVERIFIED, no scripts)\n")
              w.write("Distinct topics found: "+str(full["distinct_topics_selected"])+"/3\n")
              w.write("Direct article byte observations: "+
                      str(full["article_bytes_observed_selected"])+"/3\n")
              w.write("Question-only research angles; zero facts approved or releases.\n")
          print("B4D2_DISTINCT_RESEARCH_QUESTIONS_READY_ZERO_FACT_CLAIMS_ZERO_UPLOADS")
          PY

      - name: Prepare safe retained public research-only evidence receipt
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          python -B -m autopilot.daily_evidence_bundle \
            --plan out/flowminute-tomorrow-draft.json \
            --evidence out/flowminute-evidence-unverified.json \
            --output out/flowminute-public-research-draft-receipt.json
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("out/flowminute-public-research-draft-receipt.json")
          assert 200 <= path.stat().st_size <= 12000
          r=json.loads(path.read_text(encoding="utf8"))
          assert r["schema_version"] == 1
          assert len(r["slots"]) == 3
          assert r["status"] == "GITHUB_RETAINED_RESEARCH_DRAFT_EVIDENCE_ONLY"
          assert r["raw_source_headlines_urls_and_bodies_retained"] is False
          assert r["real_fact_or_rights_review_performed"] is False
          assert r["real_media_or_credentials_retained"] is False
          assert r["youtube_publishing_enabled"] is False
          assert r["independently_verified_unattended_youtube_releases"] == 0
          assert r["release_authorized"] is False
          lines=["", "## GitHub-only retained public research receipt",
                 "Next IST planning day: "+r["plan_day_ist"],
                 "Retained receipt SHA256: "+r["receipt_sha256"],
                 "No articles, source bodies, headlines, URLs, token values, media or approvals are retained.",
                 "21-live-video production proof: 0/21; no authenticated YouTube upload.",
                 "Artifact retention: up to 14 days under repository retention settings; this is not private permanent media escrow."]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as stream:
              stream.write("\n".join(lines)+"\n")
          print("B4D1_SANITIZED_PUBLIC_DAILY_DRAFT_READY_NEVER_UPLOAD_TO_YOUTUBE")
          PY

      - name: Retain tiny sanitized future-day plan metadata in GitHub Actions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flowminute-unapproved-research-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            out/flowminute-public-research-draft-receipt.json
            out/flowminute-public-editorial-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: Discard ephemeral unverified draft files
        if: always()
        run: rm -rf out/flowminute-scout-unverified.json out/flowminute-evidence-unverified.json out/flowminute-tomorrow-draft.json out/flowminute-public-research-draft-receipt.json out/flowminute-public-editorial-receipt.json out/flowminute-ephemeral-editorial-board.json
